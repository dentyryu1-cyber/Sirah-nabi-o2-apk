    function getMusicChain(ctx) {
      const targetVol = Math.max(0.15, Math.min(1.0, Number(state.game.musicVolume || 0.75)));
      const targetCutoff = state.game.musicStyle === "semangat" ? 3400 : 2100;
      if (!musicMasterGain || musicMasterGain.context !== ctx) {
        musicFilterNode = ctx.createBiquadFilter();
        musicFilterNode.type = "lowpass";
        musicFilterNode.frequency.setValueAtTime(targetCutoff, ctx.currentTime);
        musicMasterGain = ctx.createGain();
        musicMasterGain.gain.setValueAtTime(targetVol, ctx.currentTime);
        musicFilterNode.connect(musicMasterGain);
        musicMasterGain.connect(ctx.destination);

        const bufLen = Math.floor(ctx.sampleRate * 0.08);
        musicNoiseBuffer = ctx.createBuffer(1, bufLen, ctx.sampleRate);
        const ch = musicNoiseBuffer.getChannelData(0);
        for (let i = 0; i < bufLen; i++) ch[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufLen * 0.35));
      } else {
        musicMasterGain.gain.setTargetAtTime(targetVol, ctx.currentTime, 0.04);
        if (musicFilterNode) musicFilterNode.frequency.setTargetAtTime(targetCutoff, ctx.currentTime, 0.05);
      }
      return { dest: musicFilterNode };
    }

    function playPluckNote(ctx, dest, freq, now, dur = 0.36, vol = 0.04) {
      if (!freq) return;
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const g = ctx.createGain();
      osc1.type = "triangle";
      osc2.type = "sine";
      osc1.frequency.setValueAtTime(freq, now);
      osc2.frequency.setValueAtTime(freq * 2, now);
      g.gain.setValueAtTime(0.0008, now);
      g.gain.linearRampToValueAtTime(vol, now + 0.014);
      g.gain.exponentialRampToValueAtTime(0.0005, now + dur);
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(0.32, now);
      osc1.connect(g);
      osc2.connect(g2);
      g2.connect(g);
      g.connect(dest);
      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + dur + 0.02);
      osc2.stop(now + dur + 0.02);
    }

    function playPadChord(ctx, dest, freqs, now, dur = 1.65) {
      freqs.forEach(f => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(f, now);
        g.gain.setValueAtTime(0.0006, now);
        g.gain.linearRampToValueAtTime(0.015, now + 0.18);
        g.gain.exponentialRampToValueAtTime(0.0005, now + dur);
        osc.connect(g);
        g.connect(dest);
        osc.start(now);
        osc.stop(now + dur + 0.03);
      });
    }

    function playBassNote(ctx, dest, freq, now, dur = 0.28) {
      if (!freq) return;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, now);
      g.gain.setValueAtTime(0.0008, now);
      g.gain.linearRampToValueAtTime(0.042, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0006, now + dur);
      osc.connect(g);
      g.connect(dest);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    }

    function playDaffHit(ctx, dest, isDum, now) {
      if (isDum) {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(124, now);
        osc.frequency.exponentialRampToValueAtTime(54, now + 0.14);
        g.gain.setValueAtTime(0.052, now);
        g.gain.exponentialRampToValueAtTime(0.0008, now + 0.16);
        osc.connect(g);
        g.connect(dest);
        osc.start(now);
        osc.stop(now + 0.17);
      } else if (musicNoiseBuffer) {
        const src = ctx.createBufferSource();
        src.buffer = musicNoiseBuffer;
        const hp = ctx.createBiquadFilter();
        hp.type = "highpass";
        hp.frequency.setValueAtTime(2200, now);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.018, now);
        g.gain.exponentialRampToValueAtTime(0.0008, now + 0.07);
        src.connect(hp);
        hp.connect(g);
        g.connect(dest);
        src.start(now);
      }
    }

      const style = state.game.musicStyle || "tenang";

      const oudMelody = style === "semangat"
        ? [
            659.25, 0, 739.99, 830.61, 987.77, 830.61, 739.99, 659.25,
            587.33, 0, 659.25, 739.99, 880.00, 739.99, 659.25, 587.33,
            523.25, 0, 659.25, 783.99, 1046.50, 880.00, 783.99, 659.25,
            587.33, 659.25, 739.99, 880.00, 987.77, 0, 830.61, 0
          ]
        : [
            587.33, 0, 659.25, 698.46, 880.00, 0, 783.99, 698.46,
            587.33, 0, 523.25, 466.16, 587.33, 0, 523.25, 0,
            392.00, 0, 466.16, 587.33, 698.46, 0, 659.25, 587.33,
            554.37, 0, 659.25, 554.37, 440.00, 0, 554.37, 0
          ];

      const stepMs = style === "semangat" ? 170 : 250;
      musicInterval = setInterval(() => {
        if (!state.game.musicOn || state.tab !== "game" || state.readerChapterId || isCurrentGameVictory()) return;
        try {
          const ctx = getAudioCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const { dest } = getMusicChain(ctx);
          const step = musicStep % 32;
          musicStep += 1;

          if (step % 8 === 0) {
            playPadChord(ctx, dest, chords[Math.floor(step / 8)], now, style === "semangat" ? 1.25 : 1.75);
          }
          if (oudMelody[step]) {
            playPluckNote(ctx, dest, oudMelody[step], now, style === "semangat" ? 0.25 : 0.34, style === "semangat" ? 0.04 : 0.035);
          }
          if (bassLine[step]) {
            playBassNote(ctx, dest, bassLine[step], now, style === "semangat" ? 0.20 : 0.26);
          }
          if (style === "semangat") {
            if (step % 2 === 0) playDaffHit(ctx, dest, step % 4 === 0, now);
          } else {
            if (step % 4 === 0) playDaffHit(ctx, dest, true, now);
            else if (step % 4 === 2) playDaffHit(ctx, dest, false, now);
          }
        } catch (e) {}
      }, stepMs);
    }

    const AMBIENT_BASE_VOL = 0.055;

    function updateAmbientDucking() {
      if (!ambientRunning || !ambientMasterGain || !audioCtx) return;
      try {
        const target = isAmbientDucking() ? AMBIENT_DUCK_VOL : AMBIENT_BASE_VOL;

    function playAmbientHijazTone(ctx, dest, freq, now) {
      if (!freq || !ambientRunning) return;
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const g = ctx.createGain();
      const g2 = ctx.createGain();
      osc1.type = "sine";
      osc2.type = "triangle";
      osc1.frequency.setValueAtTime(freq, now);
      osc2.frequency.setValueAtTime(freq * 2, now);
      g.gain.setValueAtTime(0.0005, now);
      g.gain.linearRampToValueAtTime(0.15, now + 0.22);
      g.gain.exponentialRampToValueAtTime(0.0005, now + 2.7);
      g2.gain.setValueAtTime(0.16, now);
      osc1.connect(g);
      osc2.connect(g2);
      g2.connect(g);
      g.connect(dest);
      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 2.75);
      osc2.stop(now + 2.75);
    }

    function stopAmbientLoop() {
      if (ambientInterval) {
        clearInterval(ambientInterval);
        ambientInterval = null;
      }
      if (!ambientRunning && !ambientStopNodes.length) return;
      ambientRunning = false;
      const nodesToStop = ambientStopNodes;
      ambientStopNodes = [];
      const mg = ambientMasterGain;
      ambientMasterGain = null;
      if (mg && audioCtx) {
        try {
          const now = audioCtx.currentTime;
          mg.gain.cancelScheduledValues(now);
          mg.gain.setValueAtTime(Math.max(0.0001, mg.gain.value || 0.0001), now);
          mg.gain.exponentialRampToValueAtTime(0.0001, now + 0.24);
        } catch (e) {}
      }
      setTimeout(() => {
        nodesToStop.forEach(n => {
          try { if (n.stop) n.stop(); } catch (e) {}
          try { if (n.disconnect) n.disconnect(); } catch (e) {}
        });
        try { if (mg) mg.disconnect(); } catch (e) {}
      }, 280);
    }

    function startAmbientLoop() {
      if (ambientRunning) {
        updateAmbientDucking();
        return;
      }
      const ctx = getAudioCtx();
      if (!ctx) return;
      if (ctx.state === "suspended") {
        ctx.resume().then(() => {
          if (!ambientRunning) syncAmbientSound();
        }).catch(() => {});
        return;
      }

      const gen = ++ambientGen;
      ambientRunning = true;
      const now = ctx.currentTime;

      const masterGain = ctx.createGain();
      const targetVol = isAmbientDucking() ? AMBIENT_DUCK_VOL : AMBIENT_BASE_VOL;
      masterGain.gain.setValueAtTime(0.0001, now);
      masterGain.gain.linearRampToValueAtTime(targetVol, now + 0.7);
      masterGain.connect(ctx.destination);
      ambientMasterGain = masterGain;

      const lowpass = ctx.createBiquadFilter();
      lowpass.type = "lowpass";
      lowpass.frequency.setValueAtTime(1080, now);
      lowpass.Q.setValueAtTime(0.65, now);
      lowpass.connect(masterGain);

      // Layer 1: Warm meditative Maqam Hijaz drone (D3 + A3) with slow breathing LFO
      const droneGain = ctx.createGain();
      droneGain.gain.setValueAtTime(0.085, now);
      droneGain.connect(lowpass);

      const drone1 = ctx.createOscillator();
      drone1.type = "sine";
      drone1.frequency.setValueAtTime(146.83, now); // D3
      const d1Gain = ctx.createGain();
      d1Gain.gain.setValueAtTime(0.65, now);
      drone1.connect(d1Gain);
      d1Gain.connect(droneGain);

      const drone2 = ctx.createOscillator();
      drone2.type = "sine";
      drone2.frequency.setValueAtTime(220.00, now); // A3
      const d2Gain = ctx.createGain();
      d2Gain.gain.setValueAtTime(0.34, now);
      drone2.connect(d2Gain);
      d2Gain.connect(droneGain);

      const lfo = ctx.createOscillator();
      lfo.type = "sine";
      lfo.frequency.setValueAtTime(0.085, now);
      const lfoGain = ctx.createGain();
      lfoGain.gain.setValueAtTime(0.025, now);
      lfo.connect(lfoGain);
      lfoGain.connect(droneGain.gain);

      // Layer 2: Soft sanctuary night breeze (filtered pink noise loop)
      const noiseLen = Math.floor(ctx.sampleRate * 3);
      const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < noiseLen; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.997 * b0 + white * 0.029;
        b1 = 0.985 * b1 + white * 0.032;
        b2 = 0.950 * b2 + white * 0.048;
        ch[i] = (b0 + b1 + b2 + white * 0.015) * 0.25;
      }
      const fadeSamples = Math.floor(ctx.sampleRate * 0.08);
      for (let i = 0; i < fadeSamples; i++) {
        const t = i / fadeSamples;
        ch[i] *= t;
        ch[noiseLen - 1 - i] *= t;
      }
      const noiseSrc = ctx.createBufferSource();
      noiseSrc.buffer = noiseBuf;
      noiseSrc.loop = true;
      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = "bandpass";
      noiseFilter.frequency.setValueAtTime(340, now);
      noiseFilter.Q.setValueAtTime(1.6, now);
      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.065, now);
      noiseSrc.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(lowpass);

      drone1.start(now);
      drone2.start(now);
      lfo.start(now);
      noiseSrc.start(now);

      ambientStopNodes = [drone1, drone2, lfo, noiseSrc, droneGain, d1Gain, d2Gain, lfoGain, noiseFilter, noiseGain, lowpass];

      // Layer 3: Contemplative Maqam Hijaz (D4, Eb4, F#4, G4, A4) airy chimes
      const hijazScale = [
        293.66, 0, 311.13, 0, 369.99, 0, 392.00, 0,
        440.00, 0, 392.00, 369.99, 0, 311.13, 0, 293.66, 0, 0
      ];
      ambientInterval = setInterval(() => {
        if (!ambientRunning || ambientGen !== gen) return;
        try {
          if (!audioCtx || audioCtx.state !== "running") return;
          const freq = hijazScale[ambientStep % hijazScale.length];
          ambientStep += 1;
          if (freq) playAmbientHijazTone(audioCtx, lowpass, freq, audioCtx.currentTime);
        } catch (e) {}
      }, 1050);
    }

    function syncAmbientSound() {
      const gameMusicActive = state.tab === "game" && !state.readerChapterId && state.game.musicOn && !isCurrentGameVictory();
      const shouldPlay = (state.saved.ambientOn !== false) && !document.hidden && !gameMusicActive;
      if (!shouldPlay) {
        stopAmbientLoop();
        return;
      }
      if (!ambientAudioUnlocked && (!audioCtx || audioCtx.state !== "running")) return;
      startAmbientLoop();
    }

    function playFx(kind) {
      if (!state.game.soundOn) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const tone = (freq, dur, delay = 0, type = "sine", vol = 0.08) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now + delay);
          gain.gain.setValueAtTime(vol, now + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + delay);
          osc.stop(now + delay + dur);
        };
        if (kind === "diceFly") {
          [260, 340, 440, 520].forEach((f, i) => tone(f, 0.065, i * 0.075, "triangle", 0.06));
          [220, 190, 240, 180, 150].forEach((f, i) => tone(f, 0.045, 0.52 + i * 0.14, "square", 0.032));
        } else if (kind === "hop") {
          tone(480, 0.075, 0, "sine", 0.07);
        } else if (kind === "wordTap") {
          tone(580, 0.05, 0, "triangle", 0.055);
        } else if (kind === "card") {
          tone(360, 0.09, 0, "triangle", 0.06);
          tone(540, 0.14, 0.07, "sine", 0.07);
        } else if (kind === "win") {
          tone(523.25, 0.12, 0);
          tone(659.25, 0.12, 0.09);
          tone(783.99, 0.2, 0.18);
          tone(1046.5, 0.28, 0.28);
          // firework crackle pops
          tone(1320, 0.08, 0.36, "triangle", 0.045);
          tone(1568, 0.09, 0.45, "triangle", 0.04);
        } else if (kind === "wrong") {
          tone(210, 0.16, 0, "sawtooth", 0.045);
          tone(165, 0.22, 0.13, "sawtooth", 0.045);
        } else if (kind === "victory") {
          [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, idx) => tone(f, 0.26, idx * 0.11, "sine", 0.08));
        }
      } catch (e) {}
    }

    function launchFireworks(burstCount = 3) {
      const overlay = document.getElementById("game-card-overlay");
      const modalCanvas = overlay && overlay.classList.contains("open") ? document.getElementById("fireworks-canvas") : null;
      const globalCanvas = document.getElementById("global-fireworks-canvas");
      const canvas = modalCanvas || globalCanvas;
      if (!canvas) return;
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const isGlobal = canvas === globalCanvas;
      if (isGlobal) canvas.style.display = "block";
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const colors = ["#FBE5A2", "#E5B454", "#83D4B8", "#FF8A65", "#FFFFFF", "#38BDF8"];
      const particles = [];

      const spawnBurst = (cx, cy) => {
        for (let i = 0; i < 38; i++) {
          const ang = (Math.PI * 2 * i) / 38 + (Math.random() - 0.5) * 0.25;
          const spd = 2.6 + Math.random() * 4.8;
          particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 1.2,
            life: 1,
            decay: 0.014 + Math.random() * 0.012,
            color: colors[Math.floor(Math.random() * colors.length)],
            r: 2.2 + Math.random() * 2.2
          });
        }
      };

      for (let b = 0; b < burstCount; b++) {
        setTimeout(() => {
          spawnBurst(
            canvas.width * (0.2 + Math.random() * 0.6),
            canvas.height * (0.18 + Math.random() * 0.36)
          );
        }, b * 240);
      }

      let rafId = null;
      const tick = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.085;
          p.vx *= 0.985;
          p.life -= p.decay;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        if (particles.length > 0) {
          rafId = requestAnimationFrame(tick);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          cancelAnimationFrame(rafId);
          if (isGlobal) canvas.style.display = "none";
        }
      };
      requestAnimationFrame(tick);
    }

    function numberToIndonesianWords(num) {
      const n = Math.floor(Number(num));
      if (!Number.isFinite(n) || n < 0) return String(num);
      const satuan = ["", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "delapan", "sembilan", "sepuluh", "sebelas"];
      if (n === 0) return "nol";
      if (n < 12) return satuan[n];
      if (n < 20) return `${satuan[n - 10]} belas`;
      if (n < 100) {
        const puluh = Math.floor(n / 10);
        const sisa = n % 10;
        return `${satuan[puluh]} puluh${sisa ? " " + numberToIndonesianWords(sisa) : ""}`;
      }
      if (n < 200) {
        const sisa = n - 100;
        return `seratus${sisa ? " " + numberToIndonesianWords(sisa) : ""}`;
      }
      if (n < 1000) {
        const ratus = Math.floor(n / 100);
        const sisa = n % 100;
        return `${satuan[ratus]} ratus${sisa ? " " + numberToIndonesianWords(sisa) : ""}`;
      }
      if (n < 2000) {
        const sisa = n - 1000;
        return `seribu${sisa ? " " + numberToIndonesianWords(sisa) : ""}`;
      }
      if (n < 1000000) {
        const ribu = Math.floor(n / 1000);
        const sisa = n % 1000;
        return `${numberToIndonesianWords(ribu)} ribu${sisa ? " " + numberToIndonesianWords(sisa) : ""}`;
      }
      return String(n);
    }

    function formatReadingText(raw) {
      return String(raw || "")
        .replace(/±\s*(\d{3,4})\s*M\b/g, (_, y) => `sekitar tahun ${numberToIndonesianWords(y)} Masehi`)
        .replace(/\b(\d{3,4})\s*M\b/g, (_, y) => `tahun ${numberToIndonesianWords(y)} Masehi`)
        .replace(/±\s*(\d+(?:\.\d{3})+|\d+)\s*km\b/gi, (_, d) => `sekitar ${numberToIndonesianWords(d.replace(/\./g, ""))} kilometer`)
        .replace(/±\s*(\d+(?:\.\d{3})+|\d+)/g, (_, n) => `sekitar ${numberToIndonesianWords(n.replace(/\./g, ""))}`)
        .replace(/±\s*/g, "sekitar ")
        .replace(/(\d+)\s*[–-]\s*(\d+)/g, (_, a, b) => `${numberToIndonesianWords(a)} sampai ${numberToIndonesianWords(b)}`)
        .replace(/\b(\d{1,3}(?:\.\d{3})+)\b/g, (_, n) => numberToIndonesianWords(n.replace(/\./g, "")))
        .replace(/\b(\d+)\b/g, (_, n) => numberToIndonesianWords(n))
        .replace(/\bSAW\.?/g, "shallallahu alaihi wasallam")
        .replace(/\bQS\.\s*/g, "Al-Qur'an surat ")
        .replace(/\bHR\.\s*/g, "Hadits riwayat ")
        .replace(/\bNo\.\s*/g, "nomor ")
        .replace(/\bkm\b/gi, "kilometer")
        .replace(/\bthn\b/gi, "tahun")
        .replace(/'Amul Fil/g, "Amul Fil")
        .replace(/—/g, ", ")
        .replace(/\n+/g, ". ")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    function pickBestIndonesianVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      const idVoices = voices.filter(v => (v.lang || "").toLowerCase().startsWith("id"));
      const preferred = idVoices.find(v => /google|natural|neural|gadis|ardi/i.test(v.name));
      return preferred || idVoices[0] || null;
    }

    function stopSpeech() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      state.speaking = false;
      state.kronologiSpeaking = false;
      updateAmbientDucking();
    }

    function toggleSpeech(chapter) {
      if (!("speechSynthesis" in window)) return;
      if (state.speaking && !state.kronologiSpeaking) {
        stopSpeech();
        render();
        return;
      }
      stopKronologiTour();
      stopSpeech();
      const rawText = [
        chapter.title,
        ...chapter.sections.map(s => `${s.heading}. ${s.body}`)
      ].join(". ");
      const utter = new SpeechSynthesisUtterance(formatReadingText(rawText));
      utter.lang = "id-ID";
      utter.rate = 0.96;
      const voice = pickBestIndonesianVoice();
      if (voice) utter.voice = voice;
      utter.onend = () => { state.speaking = false; updateAmbientDucking(); render(); };
      utter.onerror = () => { state.speaking = false; updateAmbientDucking(); render(); };
      state.speaking = true;
      updateAmbientDucking();
      window.speechSynthesis.speak(utter);
      render();
    }

    function stopKronologiTour(keepVoice = false) {
      state.kronologiTourToken = (state.kronologiTourToken || 0) + 1;
      if (state.kronologiTourTimer) {
        clearTimeout(state.kronologiTourTimer);
        state.kronologiTourTimer = null;
      }
      state.kronologiTourPlaying = false;
      if (!keepVoice && state.kronologiSpeaking) {
        stopSpeech();
      }
    }

    function speakKronologiLoc(loc, onFinish) {
      if (!("speechSynthesis" in window) || !loc) return false;
      stopSpeech();
      const rawText = `Lokasi ke ${loc.order}: ${loc.title}. Di ${loc.place}, ${loc.year}. ${loc.summary}`;
      const utter = new SpeechSynthesisUtterance(formatReadingText(rawText));
      utter.lang = "id-ID";
      utter.rate = 0.96;
      const voice = pickBestIndonesianVoice();
      if (voice) utter.voice = voice;
      let finished = false;
      const done = () => {
        if (finished) return;
        finished = true;
        state.speaking = false;
        state.kronologiSpeaking = false;
        updateAmbientDucking();
        if (typeof onFinish === "function") onFinish();
        else render();
      };
      utter.onend = done;
      utter.onerror = done;
      state.speaking = true;
      state.kronologiSpeaking = true;
      updateAmbientDucking();
      window.speechSynthesis.speak(utter);
      return true;
    }

    function toggleKronologiSpeech() {
      if (!("speechSynthesis" in window)) return;
      if (state.kronologiSpeaking) {
        stopKronologiTour(false);
        stopSpeech();
        render();
        return;
      }
      stopKronologiTour(true);
      const loc = TIMELINE.find(t => t.id === state.selectedLocId) || TIMELINE[0];
      playFx("hop");
      speakKronologiLoc(loc);
      render();
    }

    function selectKronologiStop(locId) {
      stopKronologiTour();
      state.selectedLocId = locId;
      playFx("hop");
      render();
    }

    function stepKronologi(delta) {
      stopKronologiTour();
      const curIdx = Math.max(0, TIMELINE.findIndex(t => t.id === state.selectedLocId));
      const nextIdx = Math.max(0, Math.min(TIMELINE.length - 1, curIdx + delta));
      if (nextIdx === curIdx) return;
      state.selectedLocId = TIMELINE[nextIdx].id;
      playFx("hop");
      render();
    }

    function runKronologiTourStep() {
      if (!state.kronologiTourPlaying || state.tab !== "kronologi" || state.readerChapterId) return;
      if (state.kronologiTourTimer) {
        clearTimeout(state.kronologiTourTimer);
        state.kronologiTourTimer = null;
      }
      const token = ++state.kronologiTourToken;
      const curIdx = Math.max(0, TIMELINE.findIndex(t => t.id === state.selectedLocId));
      const loc = TIMELINE[curIdx] || TIMELINE[0];

      const advanceNow = () => {
        if (token !== state.kronologiTourToken || !state.kronologiTourPlaying) return;
        if (curIdx >= TIMELINE.length - 1) {
          stopKronologiTour();
          playFx("victory");
          render();
          return;
        }
        state.selectedLocId = TIMELINE[curIdx + 1].id;
        playFx("hop");
        render();
        runKronologiTourStep();
      };

      const canSpeak = state.kronologiAutoNarrate && ("speechSynthesis" in window);
      if (canSpeak) {
        let fallbackTimer = null;
        const spoke = speakKronologiLoc(loc, () => {
          if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
          if (token !== state.kronologiTourToken) return;
          render();
          if (state.kronologiTourPlaying) {
            state.kronologiTourTimer = setTimeout(advanceNow, 1100);
          }
        });
        render();
        if (spoke) {
          fallbackTimer = setTimeout(() => {
            if (token === state.kronologiTourToken && state.kronologiTourPlaying && !window.speechSynthesis.speaking) {
              advanceNow();
            }
          }, 18000);
          return;
        }
      }
      state.kronologiTourTimer = setTimeout(advanceNow, 4400);
    }

    function toggleKronologiTour() {
      if (state.kronologiTourPlaying) {
        stopKronologiTour();
        render();
        return;
      }
      stopSpeech();
      const curIdx = Math.max(0, TIMELINE.findIndex(t => t.id === state.selectedLocId));
      if (curIdx >= TIMELINE.length - 1) {
        state.selectedLocId = TIMELINE[0].id;
      }
      state.kronologiTourPlaying = true;
      playFx("hop");
      render();
      runKronologiTourStep();
    }

    function toggleKronologiAutoNarrate() {
      state.kronologiAutoNarrate = !state.kronologiAutoNarrate;
      if (!state.kronologiAutoNarrate && state.kronologiSpeaking) {
        stopSpeech();
        if (state.kronologiTourPlaying) {
          runKronologiTourStep();
          return;
        }
      } else if (state.kronologiAutoNarrate && state.kronologiTourPlaying) {
        runKronologiTourStep();
        return;
      }
      render();
    }

    const orbitState = {
      angle: 0,
      targetAngle: null,
      speed: 0.24,
      pausedUntil: 0,
      isDragging: false,
      dragStartX: 0,
      dragStartAngle: 0,
      dragMoved: false,
      velocity: 0,
      lastDragX: 0,
      lastDragTime: 0,
      activeIdx: 0,
      rafId: null,
      lastFrameTime: 0
    };

    function getOrbitStepAngle() {
      return (Math.PI * 2) / ORBIT_ITEMS.length;
    }

    function normalizeAngleDiff(diff) {
      let d = diff % (Math.PI * 2);
      if (d > Math.PI) d -= Math.PI * 2;
      if (d < -Math.PI) d += Math.PI * 2;
      return d;
    }

    function snapOrbitToIndex(idx, pauseMs = 6000) {
      const step = getOrbitStepAngle();
      const desiredMod = -idx * step;
      const diff = normalizeAngleDiff(desiredMod - orbitState.angle);
      orbitState.targetAngle = orbitState.angle + diff;
      orbitState.velocity = 0;
      orbitState.pausedUntil = performance.now() + pauseMs;
      orbitState.activeIdx = idx;
      syncOrbitDotsAndCta();
    }

    function onClickOrbitCard(idx) {
      if (orbitState.dragMoved) return;
      const step = getOrbitStepAngle();
      const cardTheta = orbitState.angle + idx * step;
      const cosA = Math.cos(cardTheta);
      if (idx === orbitState.activeIdx && cosA > 0.88) {
        openOrbitItem(ORBIT_ITEMS[idx]);
      } else {
        playFx("hop");
        snapOrbitToIndex(idx, 6500);
      }
    }

    function stepOrbit(dir) {
      playFx("hop");
      const nextIdx = (orbitState.activeIdx + dir + ORBIT_ITEMS.length) % ORBIT_ITEMS.length;
      snapOrbitToIndex(nextIdx, 5500);
    }

    function openOrbitItem(item) {
      if (!item) return;
      if (item.actionType === "tokoh") {
        state.tab = "tokoh";
        state.enter = true;
        state.readerChapterId = null;
        window.scrollTo({ top: 0 });
        render();
        return;
      }
      openChapter(item.target);
    }

    function openFrontOrbitItem() {
      openOrbitItem(ORBIT_ITEMS[orbitState.activeIdx] || ORBIT_ITEMS[0]);
    }

    function syncOrbitDotsAndCta() {
      const dots = document.querySelectorAll(".orbit-dot");
      dots.forEach((d, i) => d.classList.toggle("active", i === orbitState.activeIdx));
      const ctaLbl = document.getElementById("orbit-cta-label");
      const item = ORBIT_ITEMS[orbitState.activeIdx];
      if (ctaLbl && item) {
        ctaLbl.textContent = `Mulai Belajar · ${item.title}`;
      }
    }

    function updateOrbitCardPositions(now) {
      const stage = document.getElementById("orbital-stage");
      if (!stage) return false;
      const w = stage.clientWidth || 360;
      const h = stage.clientHeight || 380;
      const rx = Math.min(365, Math.max(134, w * 0.40));
      const ry = Math.min(90, Math.max(52, h * 0.19));
      const baseScale = w < 480 ? 0.46 : 0.50;
      const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const step = getOrbitStepAngle();

      let bestIdx = 0;
      let bestCos = -2;

      ORBIT_ITEMS.forEach((item, i) => {
        const el = document.getElementById("orbit-card-" + i);
        if (!el) return;
        const theta = orbitState.angle + i * step;
        const sinA = Math.sin(theta);
        const cosA = Math.cos(theta);
        const depth = (cosA + 1) / 2;
        if (cosA > bestCos) {
          bestCos = cosA;
          bestIdx = i;
        }
        const scale = baseScale + depth * 0.48;
        const floatY = reduced ? 0 : Math.sin(now * 0.0017 + i * 1.15) * 6.5;
        const x = sinA * rx;
        const y = cosA * ry + floatY;
        const rotY = -sinA * 25;
        const zIdx = cosA >= 0.04 ? (24 + Math.round(depth * 20)) : (4 + Math.round(depth * 14));
        const opacity = 0.28 + depth * 0.72;

        el.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, ${(cosA * 70).toFixed(1)}px) scale(${scale.toFixed(3)}) rotateY(${rotY.toFixed(1)}deg)`;
        el.style.zIndex = String(zIdx);
        el.style.opacity = opacity.toFixed(3);
        el.classList.toggle("is-front", cosA > 0.82);
      });

      if (bestIdx !== orbitState.activeIdx) {
        orbitState.activeIdx = bestIdx;
        syncOrbitDotsAndCta();
      }
      return true;
    }

    function tickOrbit(now) {
      if (state.tab !== "beranda" || state.readerChapterId || !document.getElementById("orbital-stage")) {
        orbitState.rafId = null;
        return;
      }
      const dt = orbitState.lastFrameTime ? Math.min(0.05, (now - orbitState.lastFrameTime) / 1000) : 0.016;
      orbitState.lastFrameTime = now;

      const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (!orbitState.isDragging) {
        if (orbitState.targetAngle !== null) {
          const diff = orbitState.targetAngle - orbitState.angle;
          if (Math.abs(diff) < 0.0025) {
            orbitState.angle = orbitState.targetAngle;
            orbitState.targetAngle = null;
          } else {
            orbitState.angle += diff * Math.min(1, dt * 8.5);
          }
        } else if (Math.abs(orbitState.velocity) > 0.01) {
          orbitState.angle += orbitState.velocity * dt;
          orbitState.velocity *= Math.pow(0.06, dt);
        } else if (!reduced && now >= orbitState.pausedUntil) {
          orbitState.angle += orbitState.speed * dt;
        }
      }

      updateOrbitCardPositions(now);
      orbitState.rafId = requestAnimationFrame(tickOrbit);
    }

    function initOrbitalStage() {
      const stage = document.getElementById("orbital-stage");
      if (!stage) return;

      const startDrag = (clientX) => {
        orbitState.isDragging = true;
        orbitState.dragMoved = false;
        orbitState.dragStartX = clientX;
        orbitState.dragStartAngle = orbitState.angle;
        orbitState.lastDragX = clientX;
        orbitState.lastDragTime = performance.now();
        orbitState.targetAngle = null;
        orbitState.velocity = 0;
        stage.classList.add("dragging");
      };

      stage.addEventListener("pointerdown", (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        startDrag(e.clientX);
      });

      if (!orbitState.windowBound) {
        orbitState.windowBound = true;
        const moveDrag = (clientX) => {
          if (!orbitState.isDragging) return;
          const activeStage = document.getElementById("orbital-stage");
          const dx = clientX - orbitState.dragStartX;
          if (Math.abs(dx) > 6) orbitState.dragMoved = true;
          const w = (activeStage && activeStage.clientWidth) || 360;
          orbitState.angle = orbitState.dragStartAngle + (dx / Math.max(170, w * 0.42)) * 2.1;
          const now = performance.now();
          const dt = Math.max(0.008, (now - orbitState.lastDragTime) / 1000);
          orbitState.velocity = ((clientX - orbitState.lastDragX) / Math.max(170, w * 0.42)) * 2.1 / dt;
          orbitState.lastDragX = clientX;
          orbitState.lastDragTime = now;
        };
        const endDrag = () => {
          if (!orbitState.isDragging) return;
          orbitState.isDragging = false;
          orbitState.pausedUntil = performance.now() + 2600;
          const activeStage = document.getElementById("orbital-stage");
          if (activeStage) activeStage.classList.remove("dragging");
          setTimeout(() => { orbitState.dragMoved = false; }, 60);
        };
        window.addEventListener("pointermove", (e) => moveDrag(e.clientX), { passive: true });
        window.addEventListener("pointerup", endDrag, { passive: true });
        window.addEventListener("pointercancel", endDrag, { passive: true });
      }

      if (orbitState.rafId) cancelAnimationFrame(orbitState.rafId);
      orbitState.lastFrameTime = 0;
      orbitState.rafId = requestAnimationFrame(tickOrbit);
    }

      const loc = TIMELINE[idx] || TIMELINE[0];

      document.querySelectorAll(".kronologi-step-btn").forEach((btn, bIdx) => {

      });

    function onClickKronoFanCard(idx) {
      if (kronoFanState.dragMoved) return;
      const loc = TIMELINE[idx];
      if (!loc) return;
      if (Math.abs(idx - kronoFanState.pos) > 0.25) {
        stopKronologiTour();
        playFx("hop");
        kronoFanState.targetPos = idx;
        kronoFanState.velocity = 0;
        syncKronoDetailsDOM(idx);
      } else {
        openChapter(loc.chapterId);
      }
    }

    function updateKronoFanCards(now) {
      const stage = document.getElementById("krono-fan-stage");
      if (!stage) return false;
      const W = stage.clientWidth || 360;
      const H = stage.clientHeight || 340;
      const isCompact = window.innerWidth < 640;
      const cardW = isCompact ? 146 : 196;
      const cardH = isCompact ? 204 : 266;
      const xStep = isCompact ? Math.min(82, Math.max(62, W * 0.21)) : Math.min(134, Math.max(94, W * 0.132));
      const yStep = isCompact ? 17 : 25;
      const curveY = isCompact ? 3.5 : 4.5;
      const cx = W * 0.5;
      const cy = H * (isCompact ? 0.44 : 0.45);
      const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let bestIdx = 0;
      let bestAbs = 99;
      TIMELINE.forEach((_, i) => {
        const card = document.getElementById(`krono-fan-card-${i}`);
        if (!card) return;
        const d = i - kronoFanState.pos;
        const absD = Math.abs(d);
        if (absD < bestAbs) {
          bestAbs = absD;
          bestIdx = i;
        }
        const x = cx - cardW / 2 + d * xStep;
        const floatY = reduced ? 0 : Math.sin(now * 0.0019 + i * 0.9) * (absD < 0.35 ? 3 : 1.5);
        const y = cy - cardH / 2 + d * yStep + (d * d) * curveY + floatY;
        const rot = d * (isCompact ? 8.5 : 10);
        const scale = Math.max(0.8, 1.05 - absD * 0.06);
        const opacity = absD > 3.3 ? 0 : Math.max(0.18, 1 - absD * 0.2);

        card.style.opacity = opacity.toFixed(3);
        card.style.zIndex = String(Math.round(40 - absD * 8));
        card.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) rotate(${rot.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
        card.classList.toggle("is-focused", absD < 0.36);
      });

      if (kronoFanState.targetPos === null && bestIdx !== kronoFanState.activeIdx) {
        kronoFanState.activeIdx = bestIdx;
        syncKronoDetailsDOM(bestIdx);
      }
      return true;
    }

    function tickKronoFan(now) {
      if (state.tab !== "kronologi" || state.readerChapterId || !document.getElementById("krono-fan-stage")) {
        kronoFanState.rafId = null;
        return;
      }
      const dt = kronoFanState.lastFrameTime ? Math.min(0.05, (now - kronoFanState.lastFrameTime) / 1000) : 0.016;
      kronoFanState.lastFrameTime = now;
      const maxIdx = TIMELINE.length - 1;

      if (!kronoFanState.isDragging) {
        if (kronoFanState.targetPos !== null) {
          const clampedTarget = Math.max(0, Math.min(maxIdx, kronoFanState.targetPos));
          const diff = clampedTarget - kronoFanState.pos;
          if (Math.abs(diff) < 0.003) {
            kronoFanState.pos = clampedTarget;
            kronoFanState.targetPos = null;
          } else {
            kronoFanState.pos += diff * Math.min(1, dt * 11);
          }
        } else if (Math.abs(kronoFanState.velocity) > 0.04) {
          kronoFanState.pos = Math.max(-0.25, Math.min(maxIdx + 0.25, kronoFanState.pos + kronoFanState.velocity * dt));
          kronoFanState.velocity *= Math.pow(0.03, dt);
          if (Math.abs(kronoFanState.velocity) <= 0.25) {
            kronoFanState.velocity = 0;
            kronoFanState.targetPos = Math.max(0, Math.min(maxIdx, Math.round(kronoFanState.pos)));
          }
        }
      }

      updateKronoFanCards(now);
      kronoFanState.rafId = requestAnimationFrame(tickKronoFan);
    }

    function initKronoFanStage() {
      const stage = document.getElementById("krono-fan-stage");
      if (!stage) return;
      const activeIdx = Math.max(0, TIMELINE.findIndex(t => t.id === state.selectedLocId));
      kronoFanState.activeIdx = activeIdx;
      kronoFanState.targetPos = activeIdx;

      stage.addEventListener("pointerdown", (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        kronoFanState.isDragging = true;
        kronoFanState.dragMoved = false;
        kronoFanState.dragStartX = e.clientX;
        kronoFanState.dragStartPos = kronoFanState.pos;
        kronoFanState.lastX = e.clientX;
        kronoFanState.lastTime = performance.now();
        kronoFanState.targetPos = null;
        kronoFanState.velocity = 0;
        stage.classList.add("dragging");
      });

      stage.addEventListener("wheel", (e) => {
        const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        if (Math.abs(delta) < 6) return;
        e.preventDefault();
        const now = performance.now();
        if (now - kronoFanState.lastWheelTime < 110) return;
        kronoFanState.lastWheelTime = now;
        stepKronologi(delta > 0 ? 1 : -1);
      }, { passive: false });

      if (!kronoFanState.windowBound) {
        kronoFanState.windowBound = true;
        const moveDrag = (clientX) => {
          if (!kronoFanState.isDragging) return;
          const activeStage = document.getElementById("krono-fan-stage");
          const dx = clientX - kronoFanState.dragStartX;
          if (Math.abs(dx) > 6) kronoFanState.dragMoved = true;
          const w = (activeStage && activeStage.clientWidth) || 360;
          const pxPerCard = Math.max(76, w * 0.16);
          const maxIdx = TIMELINE.length - 1;
          kronoFanState.pos = Math.max(-0.35, Math.min(maxIdx + 0.35, kronoFanState.dragStartPos - dx / pxPerCard));
          const now = performance.now();
          const dt = Math.max(0.008, (now - kronoFanState.lastTime) / 1000);
          kronoFanState.velocity = (-(clientX - kronoFanState.lastX) / pxPerCard) / dt;
          kronoFanState.lastX = clientX;
          kronoFanState.lastTime = now;
        };
        const endDrag = () => {
          if (!kronoFanState.isDragging) return;
          kronoFanState.isDragging = false;
          if (kronoFanState.dragMoved && state.kronologiTourPlaying) {
            stopKronologiTour();
          }
          const maxIdx = TIMELINE.length - 1;
          const projected = kronoFanState.pos + Math.max(-1.2, Math.min(1.2, kronoFanState.velocity * 0.14));
          kronoFanState.targetPos = Math.max(0, Math.min(maxIdx, Math.round(projected)));
          kronoFanState.velocity = 0;
          const activeStage = document.getElementById("krono-fan-stage");
          if (activeStage) activeStage.classList.remove("dragging");
          setTimeout(() => { kronoFanState.dragMoved = false; }, 60);
        };
        window.addEventListener("pointermove", (e) => moveDrag(e.clientX), { passive: true });
        window.addEventListener("pointerup", endDrag, { passive: true });
        window.addEventListener("pointercancel", endDrag, { passive: true });
      }

      if (kronoFanState.rafId) cancelAnimationFrame(kronoFanState.rafId);
      kronoFanState.lastFrameTime = 0;
      updateKronoFanCards(performance.now());
      kronoFanState.rafId = requestAnimationFrame(tickKronoFan);
    }

                ${TIMELINE.map((loc, idx) => `
                  <button
                    type="button"

              </div>

              <div class="kronologi-voice-bar">
                ${hasSpeech ? `
                  <button type="button" class="kronologi-voice-btn ${state.kronologiSpeaking ? "speaking" : ""}" onclick="toggleKronologiSpeech()">
                    ${state.kronologiSpeaking ? "⏹ Hentikan Suara" : "🔊 Dengarkan Narasi"}
                  </button>
                  <button type="button" class="kronologi-voice-btn" onclick="toggleKronologiAutoNarrate()" title="Aktifkan/matikan suara otomatis saat Tur berjalan">
                    ${state.kronologiAutoNarrate ? "🎙️ Narasi Tur: Aktif" : "🔇 Narasi Tur: Senyap"}
                  </button>
                ` : `<span style="font-size:11.5px;color:var(--text-muted);">Geser kartu ke samping atau tekan Putar Tur.</span>`}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderChapterQuizSlide(chId, order) {
      const slides = CHAPTER_QUIZZES[chId] || [];
      if (!slides.length) return "";
      const sIdx = state.chapterSlideIdx[chId] || 0;
      const slide = slides[sIdx];
      if (!state.chapterSlideRes[chId]) state.chapterSlideRes[chId] = {};
      const resMap = state.chapterSlideRes[chId];
      const res = resMap[sIdx] || { pickedWords: [], selected: null, checked: false, correct: false };
      const totalCorrect = Object.values(resMap).filter(r => r && r.checked && r.correct).length;

      let interactiveBody = "";
      if (slide.type === "pilihan_ganda" || slide.type === "tebak_tokoh") {
        interactiveBody = `
          <div class="stack" style="gap:8px;margin-top:10px;">
            ${slide.options.map((opt, i) => {
              let cls = "quiz-opt";
              if (res.checked) {
                if (i === slide.ans) cls += " correct";
                else if (i === res.selected) cls += " wrong";
              } else if (i === res.selected) cls += " selected";
              return `
                <button class="${cls}" ${res.checked ? "disabled" : ""} onclick="pickChapterSlideOpt('${chId}', ${sIdx}, ${i})">
                  <span class="opt-letter">${String.fromCharCode(65 + i)}</span>
                  <span style="flex:1;">${esc(opt)}</span>
                  ${res.checked && i === slide.ans ? "<span>✔</span>" : res.checked && i === res.selected && i !== slide.ans ? "<span>✕</span>" : ""}
                </button>
              `;
            }).join("")}
          </div>
        `;
      } else if (slide.type === "benar_salah") {
        const tfOpts = [{ label: "Benar", val: true }, { label: "Salah", val: false }];
        interactiveBody = `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;">
            ${tfOpts.map((o, i) => {
              let cls = "quiz-opt";
              if (res.checked) {
                if (o.val === slide.ans) cls += " correct";
                else if (res.selected === i) cls += " wrong";
              } else if (res.selected === i) cls += " selected";
              return `
                <button class="${cls}" style="justify-content:center;" ${res.checked ? "disabled" : ""} onclick="pickChapterSlideOpt('${chId}', ${sIdx}, ${i})">
                  <strong>${o.val ? "✔ Benar" : "✕ Salah"}</strong>
                </button>
              `;
            }).join("")}
          </div>
        `;
      } else if (slide.type === "susun_kata") {
        const bank = getChapterBank(chId, sIdx, slide.words);
        const picked = res.pickedWords || [];
        interactiveBody = `
          <div style="margin-top:10px;">
            <div class="word-slots">
              ${picked.length === 0
                ? `<span style="font-size:12.5px;color:var(--text-muted);">Ketuk kata di bawah secara berurutan untuk menyusun jawaban...</span>`
                : picked.map((bankIdx, pos) => `
                    <button type="button" class="word-chip picked" ${res.checked ? "disabled" : ""} onclick="unpickChapterWord('${chId}', ${sIdx}, ${pos})">${esc(bank[bankIdx].w)}</button>
                  `).join("")
              }
            </div>
            <div class="word-bank">
              ${bank.map((item, bIdx) => {
                const isUsed = picked.includes(bIdx);
                return `<button type="button" class="word-chip ${isUsed ? "used" : ""}" ${res.checked || isUsed ? "disabled" : ""} onclick="pickChapterWord('${chId}', ${sIdx}, ${bIdx})">${esc(item.w)}</button>`;
              }).join("")}
            </div>
            ${!res.checked ? `
              <div style="display:flex;gap:8px;margin-top:12px;">
                <button type="button" class="btn btn-outline" style="flex:1;" onclick="resetChapterWords('${chId}', ${sIdx})">↺ Ulangi Kata</button>
                <button type="button" class="btn btn-primary" style="flex:2;" ${picked.length < slide.words.length ? "disabled" : ""} onclick="checkChapterWords('${chId}', ${sIdx})">Periksa Susunan ✔</button>
              </div>
            ` : ""}
          </div>
        `;
      }

      const typeLabel = slide.type === "susun_kata" ? "Susun Kata" : slide.type === "benar_salah" ? "Benar / Salah" : slide.type === "tebak_tokoh" ? "Tebak Tokoh" : "Pilihan Ganda";

      return `
        <div class="card slide-quiz-card stack">
          <div class="row-between" style="flex-wrap:wrap;gap:8px;">
            <div>
              <strong style="font-size:15px;color:var(--primary);">🎯 Slide Kuis Interaktif Bab ${order}</strong>
              <div style="font-size:12px;color:var(--text-muted);">Slide ${sIdx + 1} dari ${slides.length} · ${typeLabel} · Skor Bab: ${totalCorrect}/${slides.length}</div>
            </div>
            <div class="slide-dots">
              ${slides.map((_, idx) => {
                const r = resMap[idx];
                const cls = idx === sIdx ? "active" : (r && r.checked ? (r.correct ? "done-ok" : "done-no") : "");
                return `<button type="button" class="slide-dot ${cls}" onclick="setChapterSlide('${chId}', ${idx})">${idx + 1}</button>`;
              }).join("")}
            </div>
          </div>

          <div class="slide-stage" key="${chId}_${sIdx}">
            <div style="font-size:15px;font-weight:700;line-height:1.45;">${esc(slide.prompt)}</div>
            ${interactiveBody}

            ${res.checked ? `
              <div style="margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface-var);">
                <strong style="font-size:13px;color:var(--primary);">${res.correct ? "✔ Tepat Sekali! MasyaAllah" : "✕ Belum Tepat — Ini Pembahasannya:"}</strong>
                <p style="font-size:13px;margin-top:4px;">${esc(slide.exp)}</p>
                <div style="font-size:11px;color:var(--text-muted);margin-top:3px;">Rujukan: ${esc(slide.src)}</div>
              </div>
            ` : ""}
          </div>

          <div class="row-between" style="gap:10px;padding-top:4px;">
            <button type="button" class="btn btn-outline" style="flex:1;min-height:40px;" ${sIdx === 0 ? "disabled" : ""} onclick="setChapterSlide('${chId}', ${sIdx - 1})">← Sebelumnya</button>
            <button type="button" class="btn btn-primary" style="flex:1;min-height:40px;" ${sIdx >= slides.length - 1 ? "disabled" : ""} onclick="setChapterSlide('${chId}', ${sIdx + 1})">Slide Berikutnya →</button>
          </div>
        </div>
      `;
    }

    const YT_STYLE_FILTERS = [
      { id: "SEMUA", label: "Semua", suffix: "" },
      { id: "ANIMASI", label: "Animasi Anak", suffix: "animasi kartun anak" },
      { id: "KAJIAN", label: "Kajian Sirah", suffix: "kajian sirah nabawiyah ustadz" },
      { id: "DOKUMENTER", label: "Sejarah / Dokumenter", suffix: "sejarah dokumenter" }
    ];

    function buildYtSearchUrl(query, styleId) {
      const styleObj = YT_STYLE_FILTERS.find(s => s.id === styleId) || YT_STYLE_FILTERS[0];
      const base = String(query || "").trim();
      const combined = [base, styleObj.suffix].filter(Boolean).join(" ");
      return "https://www.youtube.com/results?search_query=" + encodeURIComponent(combined);
    }

    function sanitizeYoutubeUrl(raw) {
      try {
        const u = new URL(String(raw || "").trim());
        if (u.protocol !== "https:" && u.protocol !== "http:") return null;
        const host = u.hostname.toLowerCase();
        if (host === "youtu.be" || host === "youtube.com" || host === "www.youtube.com" || host === "m.youtube.com") {
          return u.toString();
        }
      } catch (e) {}
      return null;
    }

    function updateYtSearchInput(chId, val) {
      state.ytQueryByChapter[chId] = val;
      const btn = document.getElementById("yt-search-go-" + chId);
      if (btn) {
        const styleId = state.ytStyleByChapter[chId] || "SEMUA";
        const fallback = (CHAPTER_YOUTUBE[chId] && CHAPTER_YOUTUBE[chId].defaultQuery) || "Sirah Nabi Muhammad SAW";
        btn.href = buildYtSearchUrl(val.trim() || fallback, styleId);
      }
    }

    function setYtStyleFilter(chId, styleId) {
      state.ytStyleByChapter[chId] = styleId;
      render();
    }

    function resetYtSearch(chId) {
      const def = (CHAPTER_YOUTUBE[chId] && CHAPTER_YOUTUBE[chId].defaultQuery) || "Sirah Nabi Muhammad SAW";
      state.ytQueryByChapter[chId] = def;
      state.ytStyleByChapter[chId] = "SEMUA";
      render();
    }

    function saveCustomYoutubeLink(chId) {
      const urlInput = document.getElementById("yt-custom-url-" + chId);
      const labelInput = document.getElementById("yt-custom-label-" + chId);
      const cleanUrl = sanitizeYoutubeUrl(urlInput ? urlInput.value : "");
      if (!cleanUrl) {
        state.ytCustomStatus[chId] = "Masukkan tautan YouTube yang valid (contoh: https://www.youtube.com/watch?v=... atau https://youtu.be/...).";
        render();
        return;
      }
      if (!state.saved.customVideos) state.saved.customVideos = {};
      if (!Array.isArray(state.saved.customVideos[chId])) state.saved.customVideos[chId] = [];
      const title = (labelInput && labelInput.value.trim()) || "Video Pilihan Guru / Kelompok";
      state.saved.customVideos[chId].push({ title, url: cleanUrl });
      state.ytCustomStatus[chId] = "";
      saveState();
      render();
    }

    function removeCustomYoutubeLink(chId, idx) {
      if (!state.saved.customVideos || !Array.isArray(state.saved.customVideos[chId])) return;
      state.saved.customVideos[chId].splice(idx, 1);
      saveState();
      render();
    }

    function renderChapterYouTubeCard(c) {
      const yt = CHAPTER_YOUTUBE[c.id] || {
        defaultQuery: `Sirah Nabi Muhammad ${c.title}`,
        choices: [
          { tag: "Kisah Lengkap", title: c.title, desc: "Tonton penjelasan kisah bab ini di YouTube.", query: `sirah nabi muhammad ${c.title}` }
        ]
      };

      const currStyle = state.ytStyleByChapter[c.id] || "SEMUA";

      const customList = (state.saved.customVideos && Array.isArray(state.saved.customVideos[c.id])) ? state.saved.customVideos[c.id] : [];
      const errMsg = state.ytCustomStatus[c.id] || "";

      return `
        <div class="card yt-card stack">
          <div class="row-between" style="flex-wrap:wrap;gap:8px;">
            <div>
              <strong style="font-size:15px;color:#B91C1C;">📺 Pilihan Link YouTube &amp; Cari Video</strong>
              <div style="font-size:12px;color:var(--text-muted);">Pilih rekomendasi video YouTube untuk Bab ${c.order} atau cari video yang sesuai kebutuhan kelas.</div>
            </div>
            <span class="pill" style="background:rgba(220,38,38,0.12);color:#B91C1C;">Video Pendukung</span>
          </div>

          <div class="yt-link-list">
            ${yt.choices.map((ch) => `
              <a class="yt-link-item" href="${buildYtSearchUrl(ch.query, 'SEMUA')}" target="_blank" rel="noopener noreferrer">
                <span class="yt-play-badge">▶</span>
                <div style="flex:1;min-width:0;">
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                    <span class="pill" style="font-size:10px;padding:2px 8px;">${esc(ch.tag)}</span>
                    <strong style="font-size:13.5px;">${esc(ch.title)}</strong>
                  </div>
                  <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${esc(ch.desc)}</div>
                </div>
                <span style="font-size:12px;font-weight:700;color:#DC2626;white-space:nowrap;">Buka ↗</span>
              </a>
            `).join("")}
          </div>

          <div class="yt-search-panel">
            <div class="row-between" style="flex-wrap:wrap;gap:6px;">
              <strong style="font-size:13.5px;">🔍 Cari Video yang Sesuai</strong>
              <button type="button" class="chip" style="padding:4px 10px;font-size:11px;" onclick="resetYtSearch('${c.id}')">↺ Kata Kunci Bab</button>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              ${YT_STYLE_FILTERS.map(f => `
                <button type="button" class="chip ${currStyle === f.id ? "active" : ""}" style="padding:5px 11px;font-size:11.5px;" onclick="setYtStyleFilter('${c.id}', '${f.id}')">${esc(f.label)}</button>
              `).join("")}
            </div>
            <input class="search-box" style="background:var(--surface);" type="text" placeholder="Ketik kata kunci video YouTube yang dicari..." value="${esc(currQuery)}" oninput="updateYtSearchInput('${c.id}', this.value)" />
            <a id="yt-search-go-${c.id}" class="yt-btn" href="${searchHref}" target="_blank" rel="noopener noreferrer">
              <span>▶</span>
              <span>Cari Video yang Sesuai di YouTube ↗</span>
            </a>
          </div>

          <div style="border-top:1px solid color-mix(in srgb,var(--outline) 45%,transparent);padding-top:10px;display:flex;flex-direction:column;gap:8px;">
            <strong style="font-size:13px;">📌 Simpan Link YouTube Pilihan Sendiri (Opsional)</strong>
            ${customList.length ? `
              <div class="yt-link-list">
                ${customList.map((item, idx) => `
                  <div class="yt-link-item" style="justify-content:space-between;">
                    <a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer" style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-decoration:none;color:inherit;">
                      <span class="yt-play-badge">▶</span>
                      <div style="min-width:0;">
                        <strong style="font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(item.title)}</strong>
                        <span style="font-size:11px;color:var(--text-muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(item.url)}</span>
                      </div>
                    </a>
                    <button type="button" class="chip" style="padding:4px 9px;font-size:11px;flex-shrink:0;" onclick="removeCustomYoutubeLink('${c.id}', ${idx})">Hapus</button>
                  </div>
                `).join("")}
              </div>
            ` : ""}
            <div style="display:grid;grid-template-columns:1fr;gap:6px;">
              <input id="yt-custom-label-${c.id}" class="search-box" type="text" placeholder="Judul video (mis. Video Pilihan Ustadz / Animasi)" />
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <input id="yt-custom-url-${c.id}" class="search-box" style="flex:1;min-width:180px;" type="url" placeholder="Tempel link YouTube (https://youtube.com/...)" />
                <button type="button" class="btn btn-outline" style="width:auto;min-height:42px;padding:0 14px;" onclick="saveCustomYoutubeLink('${c.id}')">+ Simpan Link</button>
              </div>
              ${errMsg ? `<div style="font-size:12px;color:#B91C1C;">⚠️ ${esc(errMsg)}</div>` : ""}
            </div>
          </div>
        </div>
      `;
    }

    function setChapterSlide(chId, idx) {
      const slides = CHAPTER_QUIZZES[chId] || [];
      if (idx < 0 || idx >= slides.length) return;
      state.chapterSlideIdx[chId] = idx;
      render();
    }

    function pickChapterSlideOpt(chId, sIdx, optIdx) {
      if (!state.chapterSlideRes[chId]) state.chapterSlideRes[chId] = {};
      const curr = state.chapterSlideRes[chId][sIdx];
      if (curr && curr.checked) return;
      const slide = CHAPTER_QUIZZES[chId][sIdx];
      const isOk = slide.type === "benar_salah" ? ((optIdx === 0) === slide.ans) : (optIdx === slide.ans);
      state.chapterSlideRes[chId][sIdx] = { selected: optIdx, checked: true, correct: isOk };
      playFx(isOk ? "win" : "wrong");
      render();
    }

    function pickChapterWord(chId, sIdx, bankIdx) {
      if (!state.chapterSlideRes[chId]) state.chapterSlideRes[chId] = {};
      const curr = state.chapterSlideRes[chId][sIdx] || { pickedWords: [], checked: false, correct: false };
      if (curr.checked || curr.pickedWords.includes(bankIdx)) return;
      curr.pickedWords = [...curr.pickedWords, bankIdx];
      state.chapterSlideRes[chId][sIdx] = curr;
      playFx("hop");
      render();
    }

    function unpickChapterWord(chId, sIdx, pos) {
      const curr = state.chapterSlideRes[chId] && state.chapterSlideRes[chId][sIdx];
      if (!curr || curr.checked) return;
      curr.pickedWords = curr.pickedWords.filter((_, idx) => idx !== pos);
      render();
    }

    function resetChapterWords(chId, sIdx) {
      if (!state.chapterSlideRes[chId]) state.chapterSlideRes[chId] = {};
      state.chapterSlideRes[chId][sIdx] = { pickedWords: [], checked: false, correct: false };
      render();
    }

    function checkChapterWords(chId, sIdx) {
      const slide = CHAPTER_QUIZZES[chId][sIdx];
      const curr = state.chapterSlideRes[chId] && state.chapterSlideRes[chId][sIdx];
      if (!curr || curr.checked) return;
      const bank = getChapterBank(chId, sIdx, slide.words);
      const assembled = curr.pickedWords.map(bIdx => bank[bIdx].w).join(" ");
      const target = slide.words.join(" ");
      curr.checked = true;
      curr.correct = assembled === target;
      playFx(curr.correct ? "win" : "wrong");
      render();
    }

    function renderDiceFacePips(val) {
      const map = {
        1: [4],
        2: [0, 8],
        3: [0, 4, 8],
        4: [0, 2, 6, 8],
        5: [0, 2, 4, 6, 8],
        6: [0, 2, 3, 5, 6, 8]
      };
      const active = map[val] || [4];
      return Array.from({ length: 9 }, (_, i) => {
        if (!active.includes(i)) return `<span></span>`;
        return `<span class="pip ${val === 1 ? "gold" : ""}"></span>`;
      }).join("");
    }

    const SNAKE_ORDER = [1,2,3,4, 8,7,6,5, 9,10,11,12, 16,15,14,13];
    const gameShuffledBank = {};
    function getGameCardBank(cardId, words) {
      const key = `${cardId}_${state.game.deckPtr}_${state.game.round}`;
      if (!gameShuffledBank[key]) {
        gameShuffledBank[key] = shuffleWords(words);
      }
      return gameShuffledBank[key];
    }

    let memFlipTimeout = null;
    let blitzTimerInterval = null;
    let buzzerTimerInterval = null;
    let diceCardDelayTimeout = null;

    function clearAllGameTimers() {
      clearTimeout(diceRollTimeout);
      clearTimeout(diceCardDelayTimeout);
      clearInterval(stepInterval);
      clearTimeout(memFlipTimeout);
      clearInterval(blitzTimerInterval);
      clearInterval(buzzerTimerInterval);
    }

    function selectArcadeGame(gameKey) {
      clearAllGameTimers();
      state.game.activeCard = null;
      if (state.game.phase === "ROLLING" || state.game.phase === "MOVING" || state.game.phase === "CARD_POP") {
        state.game.phase = "SETUP";
      }
      state.activeGame = gameKey;
      renderGameCardModal();
      syncGameMusic();
      render();
    }

    function renderAudioControlsStrip() {
      const g = state.game;
      return `
        <div class="audio-controls-bar">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span style="font-size:12px;font-weight:700;color:var(--text-muted);">Gaya Musik:</span>
            <button type="button" class="chip ${g.musicStyle === 'tenang' ? 'active' : ''}" style="min-height:30px;padding:4px 10px;font-size:11.5px;" onclick="setMusicStyle('tenang')">🌿 Tenang</button>
            <button type="button" class="chip ${g.musicStyle === 'semangat' ? 'active' : ''}" style="min-height:30px;padding:4px 10px;font-size:11.5px;" onclick="setMusicStyle('semangat')">🔥 Semangat Lomba</button>
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-left:auto;">
            <span style="font-size:11.5px;font-weight:700;color:var(--text-muted);">Vol:</span>
            <input type="range" class="vol-range" min="0.2" max="1" step="0.05" value="${g.musicVolume}" oninput="setMusicVolume(this.value)" aria-label="Volume Musik" />
            <span id="music-vol-pct" style="font-size:11.5px;font-weight:700;min-width:34px;font-variant-numeric:tabular-nums;">${Math.round((g.musicVolume || 0.75) * 100)}%</span>
          </div>
        </div>
      `;
    }

    function renderGameActionButtons(setupFnName) {
      const g = state.game;
      return `
        <div style="display:flex;gap:6px;align-items:center;">
          <button type="button" class="btn-icon" style="min-width:36px;min-height:36px;font-size:14px;" onclick="toggleGameMusic()" title="Musik Latar">${g.musicOn ? "🎵" : "🔕"}</button>
          <button type="button" class="btn-icon" style="min-width:36px;min-height:36px;font-size:14px;" onclick="toggleGameSound()" title="Efek Suara">${g.soundOn ? "🔊" : "🔇"}</button>
          <button type="button" class="btn-icon" style="min-width:36px;min-height:36px;font-size:14px;" onclick="togglePresentMode()" title="${g.presentMode ? 'Keluar Mode Layar Penuh' : 'Mode Layar Penuh / Proyektor'}">${g.presentMode ? "🗗" : "⛶"}</button>
          ${setupFnName ? `<button type="button" class="btn-icon" style="min-width:36px;min-height:36px;font-size:14px;" onclick="${setupFnName}()" title="Pengaturan Mode">⚙️</button>` : ""}
        </div>
      `;
    }

    function renderSharedModeSetupCard(titleLabel, rulesHtml, startFnName, extraHtml = "") {
      const g = state.game;
      return `
        <div class="card stack" style="padding:18px;">
          <strong style="font-size:15px;">1. Pilih Mode Permainan (${titleLabel})</strong>
          <div class="mode-grid">
            <button type="button" class="mode-btn ${g.mode==='solo'?'selected':''}" onclick="setGameMode('solo')">
              <div style="font-size:20px;">🧭</div>
              <strong style="font-size:14px;display:block;margin-top:4px;">Mode Solo</strong>
              <span style="font-size:11.5px;color:var(--text-muted);">1 pemain mengejar skor tertinggi.</span>
            </button>
            <button type="button" class="mode-btn ${g.mode==='group'?'selected':''}" onclick="setGameMode('group')">
              <div style="font-size:20px;">👥</div>
              <strong style="font-size:14px;display:block;margin-top:4px;">Mode Kelompok</strong>
              <span style="font-size:11.5px;color:var(--text-muted);">2–4 kelompok berlomba secara adil.</span>
            </button>
          </div>

          ${g.mode === "group" ? `
            <div>
              <strong style="font-size:14px;display:block;margin-bottom:8px;">2. Jumlah Kelompok</strong>

    function wrapSemiIdx(idx) {
      const n = ARCADE_GAMES.length;

    function syncSemiInfoPane() {

    function stepSemiCarousel(delta) {
      playFx("hop");
      const base = semiState.targetPos !== null ? Math.round(semiState.targetPos) : Math.round(semiState.pos);
      semiState.targetPos = base + delta;
      semiState.velocity = 0;
    }

    function onClickSemiCard(idx) {
      if (semiState.dragMoved) return;
      const n = ARCADE_GAMES.length;
      let d = (idx - semiState.pos) % n;
      if (d > n / 2) d -= n;
      if (d < -n / 2) d += n;
      if (Math.abs(d) > 0.22) {
        playFx("hop");
        semiState.targetPos = Math.round(semiState.pos + d);
        semiState.velocity = 0;
      } else {
        selectArcadeGame(ARCADE_GAMES[idx].id);
      }
    }

    function launchFocusedArcadeGame() {
      const item = ARCADE_GAMES[semiState.activeIdx] || ARCADE_GAMES[0];
      if (item) selectArcadeGame(item.id);
    }

    function updateSemiCards(now) {
      const pane = document.getElementById("semi-wheel-pane");
      if (!pane) return false;
      const W = pane.clientWidth || 320;
      const H = pane.clientHeight || 420;
      const isCompact = window.innerWidth < 640;
      const cardW = isCompact ? Math.min(168, Math.max(138, W - 26)) : Math.min(266, Math.max(200, W - 70));
      const cardH = isCompact ? 54 : 70;
      const xApex = isCompact ? Math.max(24, W - cardW * 0.94) : Math.max(54, W - cardW - 28);
      const targetR = isCompact ? Math.max(200, Math.min(275, H * 0.62)) : Math.max(260, Math.min(350, H * 0.65));
      const cx = Math.max(W + (isCompact ? 54 : 68), xApex + targetR);
      const R = cx - xApex;
      const cy = H * 0.5;

      const maxY = Math.min(H * 0.36, 195);
      const maxAlpha = Math.asin(Math.min(0.86, maxY / Math.max(180, R)));
      const stepAngle = maxAlpha / 2.02;

      const arcCircle = document.getElementById("semi-arc-circle");
      const arcGlowCircle = document.getElementById("semi-arc-glow");
      const arcInnerCircle = document.getElementById("semi-arc-inner");
      const pointer = document.getElementById("semi-focus-pointer");
      if (arcCircle) {
        arcCircle.setAttribute("cx", cx.toFixed(1));
        arcCircle.setAttribute("cy", cy.toFixed(1));
        arcCircle.setAttribute("r", R.toFixed(1));
      }
      if (arcGlowCircle) {
        arcGlowCircle.setAttribute("cx", cx.toFixed(1));
        arcGlowCircle.setAttribute("cy", cy.toFixed(1));
        arcGlowCircle.setAttribute("r", R.toFixed(1));
      }
      if (arcInnerCircle) {
        arcInnerCircle.setAttribute("cx", cx.toFixed(1));
        arcInnerCircle.setAttribute("cy", cy.toFixed(1));
        arcInnerCircle.setAttribute("r", Math.max(120, R - (isCompact ? 14 : 20)).toFixed(1));
      }
      if (pointer) {
        const px = Math.max(6, xApex - (isCompact ? 18 : 26));
        pointer.setAttribute("transform", `translate(${px.toFixed(1)}, ${cy.toFixed(1)})`);
      }

      const btnAlpha = Math.min(0.95, maxAlpha * 1.15);
      const btnUp = document.getElementById("semi-nav-up");
      const btnDown = document.getElementById("semi-nav-down");
      if (btnUp && btnDown) {
        const bx = Math.min(W - 26, Math.max(24, cx - R * Math.cos(btnAlpha)));
        const byTop = Math.max(26, cy - R * Math.sin(btnAlpha));
        const byBot = Math.min(H - 26, cy + R * Math.sin(btnAlpha));
        btnUp.style.left = `${bx.toFixed(1)}px`;
        btnUp.style.top = `${byTop.toFixed(1)}px`;
        btnDown.style.left = `${bx.toFixed(1)}px`;
        btnDown.style.top = `${byBot.toFixed(1)}px`;
      }

      const n = ARCADE_GAMES.length;
      const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let bestIdx = 0;
      let bestAbs = 99;

      ARCADE_GAMES.forEach((_, i) => {
        const card = document.getElementById(`semi-card-${i}`);
        if (!card) return;
        let d = (i - semiState.pos) % n;
        if (d > n / 2) d -= n;
        if (d < -n / 2) d += n;

        const absD = Math.abs(d);
        if (absD < bestAbs) {
          bestAbs = absD;
          bestIdx = i;
        }

        const alpha = d * stepAngle;
        const arcX = cx - R * Math.cos(alpha);
        const arcY = cy + R * Math.sin(alpha);
        const scale = Math.max(0.68, 1.07 - absD * 0.145);
        const floatY = reduced ? 0 : Math.sin(now * 0.0022 + i * 1.15) * (absD < 0.35 ? 3.2 : 2);
        const rotY = -5 - absD * 5.5;
        const rotZ = d * 3.4;
        const opacity = absD > 2.45 ? 0 : Math.max(0, Math.min(1, 1.08 - absD * 0.25));

        card.style.width = `${cardW}px`;
        card.style.opacity = opacity.toFixed(3);
        card.style.pointerEvents = opacity > 0.14 ? "auto" : "none";
        card.style.zIndex = String(Math.round(40 - absD * 8));
        const leftPos = arcX - (isCompact ? 8 : 12);
        card.style.transform = `translate3d(${leftPos.toFixed(1)}px, ${(arcY - cardH / 2 + floatY).toFixed(1)}px, 0) perspective(900px) rotateY(${rotY.toFixed(1)}deg) rotateZ(${rotZ.toFixed(1)}deg) scale(${scale.toFixed(3)})`;
        card.classList.toggle("is-focused", absD < 0.35);
      });

      if (bestIdx !== semiState.activeIdx) {
        semiState.activeIdx = bestIdx;
        syncSemiInfoPane();
      }
      return true;
    }

    function tickSemiCarousel(now) {
      if (state.tab !== "game" || state.activeGame !== "hub" || state.readerChapterId || !document.getElementById("semi-wheel-pane")) {
        semiState.rafId = null;
        return;
      }
      const dt = semiState.lastFrameTime ? Math.min(0.05, (now - semiState.lastFrameTime) / 1000) : 0.016;
      semiState.lastFrameTime = now;

      if (!semiState.isDragging) {
        if (semiState.targetPos !== null) {
          const diff = semiState.targetPos - semiState.pos;
          if (Math.abs(diff) < 0.0025) {
            semiState.pos = wrapSemiIdx(Math.round(semiState.targetPos));
            semiState.targetPos = null;
          } else {
            semiState.pos += diff * Math.min(1, dt * 11.5);
          }
        } else if (Math.abs(semiState.velocity) > 0.05) {
          semiState.pos += semiState.velocity * dt;
          semiState.velocity *= Math.pow(0.03, dt);
          if (Math.abs(semiState.velocity) <= 0.25) {
            semiState.velocity = 0;
            semiState.targetPos = Math.round(semiState.pos);
          }
        }
      }

      updateSemiCards(now);
      semiState.rafId = requestAnimationFrame(tickSemiCarousel);
    }

    function initSemiCarousel() {
      const pane = document.getElementById("semi-wheel-pane");
      if (!pane) return;

      pane.addEventListener("pointerdown", (e) => {
        if (e.target && e.target.closest(".semi-nav-btn")) return;
        if (e.button !== undefined && e.button !== 0) return;
        semiState.isDragging = true;
        semiState.dragMoved = false;
        semiState.dragStartY = e.clientY;
        semiState.dragStartPos = semiState.pos;
        semiState.lastY = e.clientY;
        semiState.lastTime = performance.now();
        semiState.targetPos = null;
        semiState.velocity = 0;
        pane.classList.add("dragging");
      });

      pane.addEventListener("wheel", (e) => {
        if (Math.abs(e.deltaY) < 4) return;
        e.preventDefault();
        const now = performance.now();
        if (now - semiState.lastWheelTime < 95) return;
        semiState.lastWheelTime = now;
        stepSemiCarousel(e.deltaY > 0 ? 1 : -1);
      }, { passive: false });

      if (!semiState.windowBound) {
        semiState.windowBound = true;
        const moveDrag = (clientY) => {
          if (!semiState.isDragging) return;
          const activePane = document.getElementById("semi-wheel-pane");
          const dy = clientY - semiState.dragStartY;
          if (Math.abs(dy) > 6) semiState.dragMoved = true;
          const h = (activePane && activePane.clientHeight) || 420;
          const pxPerItem = Math.max(66, h * 0.19);
          semiState.pos = semiState.dragStartPos - dy / pxPerItem;
          const now = performance.now();
          const dt = Math.max(0.008, (now - semiState.lastTime) / 1000);
          semiState.velocity = (-(clientY - semiState.lastY) / pxPerItem) / dt;
          semiState.lastY = clientY;
          semiState.lastTime = now;
        };
        const endDrag = () => {
          if (!semiState.isDragging) return;
          semiState.isDragging = false;
          const projected = semiState.pos + Math.max(-1.5, Math.min(1.5, semiState.velocity * 0.16));
          semiState.targetPos = Math.round(projected);
          semiState.velocity = 0;
          const activePane = document.getElementById("semi-wheel-pane");
          if (activePane) activePane.classList.remove("dragging");
          setTimeout(() => { semiState.dragMoved = false; }, 60);
        };
        window.addEventListener("pointermove", (e) => moveDrag(e.clientY), { passive: true });
        window.addEventListener("pointerup", endDrag, { passive: true });
        window.addEventListener("pointercancel", endDrag, { passive: true });
      }

      if (semiState.rafId) cancelAnimationFrame(semiState.rafId);
      semiState.lastFrameTime = 0;
      updateSemiCards(performance.now());
      semiState.rafId = requestAnimationFrame(tickSemiCarousel);
    }

    function renderDiceGame() {
      const g = state.game;

      if (g.phase === "SETUP") {
        return `
          <div class="container stack">
            <div class="game-top-bar">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <button type="button" class="chip" onclick="selectArcadeGame('hub')">← Daftar Game</button>
                <h1 style="font-size:22px;">Permainan Kartu &amp; Dadu 3D</h1>
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                ${renderGameActionButtons(null)}
                <div class="k3-3d-wrap"><span class="k3-3d-badge"><span class="k3-3d-text">Kelompok 3 · 3D</span></span></div>
              </div>
            </div>
            ${renderSharedModeSetupCard(
              "Kartu & Dadu 3D",
              `• Giliran ronde <strong>sama rata</strong> bagi seluruh kelompok.<br/>
               • <strong>Kotak Spesial</strong>: ✨ Berkah (+10 pt), 🐪 Kafilah (+1 langkah), 🏛️ Tantangan Emas (poin kartu 2x).<br/>
               • Jawaban benar berturut-turut memberi <strong>+5 Poin Kombo</strong> + bonus finis +20.`,
              "startGameMatch"
            )}
          </div>
        `;
      }

      if (g.phase === "VICTORY") {
        const ranked = [...g.players].sort((a, b) => (b.score - a.score) || (b.correct - a.correct) || (b.pos - a.pos));
        const topScore = ranked[0].score;
        const winners = ranked.filter(p => p.score === topScore && p.correct === ranked[0].correct);
        const headline = g.mode === "solo"
          ? `Skor Akhir: ${ranked[0].score} Poin`
          : winners.length > 1
            ? `Seri Adil! Juara Bersama (${topScore} Poin)`
            : `Pemenang: ${esc(winners[0].name)} (${topScore} Poin)`;

        return renderFairLeaderboard(
          g.players,
          headline,
          "Ronde selesai adil untuk seluruh peserta.",
          p => `Kotak ${p.pos}/16 · Benar ${p.correct}/${p.answered}`,
          "openGameSetup",
          "startGameMatch",
          "🎲 Main Lagi"
        );

      const activePlayer = g.players[g.turnIdx] || g.players[0];
      const shownRot = (g.phase === "ROLLING" && g.diceRollingStart) ? g.prevDiceRot : g.diceRot;
      const diceTransform = `rotateX(${shownRot.x}deg) rotateY(${shownRot.y}deg) rotateZ(${shownRot.z || 0}deg)`;
      const currTile = BOARD_TILES.find(t => t.pos === activePlayer.pos) || BOARD_TILES[0];

      return `
        <div class="container stack">
          <div class="row-between" style="flex-wrap:wrap;gap:8px;">
