              <div>
                <h1 style="font-size:20px;">Kartu &amp; Dadu 3D</h1>
                <p style="font-size:11.5px;color:var(--text-muted);">Ronde ${g.round} · ${g.mode === "solo" ? "Mode Solo" : `Giliran ${esc(activePlayer.name)}`}${g.finishTriggered ? " · Ronde Terakhir!" : ""}</p>
              </div>
            </div>
            ${renderGameActionButtons("openGameSetup")}
          </div>

          <div class="players-bar">
            ${g.players.map((p, idx) => `
              <div class="player-pill-card ${idx === g.turnIdx ? 'turn-now' : ''}">
                <span class="player-dot" style="background:${p.color};">${esc(p.code)}</span>
                <div style="flex:1;min-width:0;">
                  <div style="font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(p.name)}${(p.streak || 0) >= 2 ? ` 🔥${p.streak}` : ""}</div>
                  <div style="font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;">Kotak ${p.pos} · <strong>${p.score} pt</strong></div>
                </div>
              </div>
            `).join("")}
          </div>

          ${g.tileNotice ? `<div class="tile-notice-banner">${esc(g.tileNotice)}</div>` : ""}

          <div class="board-3d-wrap">
            <div class="board-3d-grid">
              ${SNAKE_ORDER.map(posNum => {
                const tile = BOARD_TILES[posNum - 1];
                const playersHere = g.players.filter(p => p.pos === tile.pos);
                const isActive = activePlayer.pos === tile.pos;
                const isPassed = tile.pos < activePlayer.pos;
                const isGoal = tile.pos === 16;
                const spCls = tile.special ? `tile-${tile.special}` : "";
                return `
                  <div class="board-tile ${isActive ? "active" : ""} ${isPassed ? "passed" : ""} ${isGoal ? "goal" : ""} ${spCls}" title="${esc(tile.specialDesc || tile.kind)}">
                    ${tile.specialTag ? `<span class="tile-tag">${esc(tile.specialTag)}</span>` : ""}
                    ${playersHere.length ? `
                      <div class="pawns-stack">
                        ${playersHere.map(p => `
                          <span class="pawn-mini ${p.id === activePlayer.id && g.phase === 'MOVING' ? 'hopping' : ''}" style="background:${p.color};" title="${esc(p.name)}">${esc(p.code)}</span>
                        `).join("")}
                      </div>
                    ` : ""}
                    <span class="tile-num">${tile.pos}</span>
                    <span class="tile-ico">${tile.ico}</span>
                    <span class="tile-lbl">${esc(tile.name)}</span>
                    <span class="tile-kind">${esc(tile.kind)}</span>
                  </div>
                `;
              }).join("")}
            </div>
          </div>

          <div class="board-legend">
            <span>✨ Kotak Berkah (+10 pt)</span>
            <span>🐪 Kotak Kafilah (Maju +1)</span>
            <span>🏛️ Tantangan Emas (Kartu 2x)</span>
          </div>

          <div class="card dice-panel">
            <div class="dice-scene">
              <div class="dice-shadow ${g.phase === 'ROLLING' ? 'flying' : ''}"></div>
              <div class="dice-flight ${g.phase === 'ROLLING' ? 'flying' : ''}">
                <div id="dice-cube-3d" class="dice-cube" style="transform:${diceTransform};">
                  <div class="dice-face dice-f1">${renderDiceFacePips(1)}</div>
                  <div class="dice-face dice-f2">${renderDiceFacePips(2)}</div>
                  <div class="dice-face dice-f3">${renderDiceFacePips(3)}</div>
                  <div class="dice-face dice-f4">${renderDiceFacePips(4)}</div>
                  <div class="dice-face dice-f5">${renderDiceFacePips(5)}</div>
                  <div class="dice-face dice-f6">${renderDiceFacePips(6)}</div>
                </div>
              </div>
            </div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:13px;font-weight:700;color:var(--primary);">

                  ? `${esc(activePlayer.name)}: Dadu Terbang &amp; Menggelinding!`
                  : g.phase === "MOVING"
                    ? `${esc(activePlayer.name)} Melangkah...`
                    : `Giliran ${esc(activePlayer.name)} · Kotak ${currTile.pos}`}
              </div>
              <p style="font-size:12px;color:var(--text-muted);margin:3px 0 8px;">
                ${g.phase === "IDLE" ? `Dadu terakhir: ${g.lastRoll} · Tekan untuk lempar dadu terbang &amp; menggelinding.` : "Tunggu pion mendarat untuk membuka kartu!"}
              </p>
              <button type="button" class="btn btn-primary" style="min-height:42px;" ${g.phase !== "IDLE" ? "disabled" : ""} onclick="rollDice3D()">
                🎲 ${g.phase === "ROLLING" ? "Dadu Menggelinding..." : g.phase === "MOVING" ? "Melangkah..." : "Kocok Dadu 3D"}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function buildCardChallengeHtml() {
      const g = state.game;
      const c = g.activeCard;
      const activePlayer = g.players[g.turnIdx] || g.players[0];
      if (!c) return "";

      let challengeMarkup = "";
      if (c.type === "pertanyaan" || c.type === "tebak_tokoh" || c.type === "bonus") {
        challengeMarkup = `
          <div class="stack" style="gap:8px;margin-top:12px;">
            ${c.options.map((opt, i) => {
              let cls = "quiz-opt";
              if (g.cardChecked) {
                if (i === c.ans) cls += " correct";
                else if (i === g.cardSelectedOpt) cls += " wrong";
              } else if (i === g.cardSelectedOpt) cls += " selected";
              return `
                <button class="${cls}" ${g.cardChecked ? "disabled" : ""} onclick="answerGameCardOpt(${i})">
                  <span class="opt-letter">${String.fromCharCode(65 + i)}</span>
                  <span style="flex:1;">${esc(opt)}</span>
                  ${g.cardChecked && i === c.ans ? "<span>✔</span>" : g.cardChecked && i === g.cardSelectedOpt && i !== c.ans ? "<span>✕</span>" : ""}
                </button>
              `;
            }).join("")}
          </div>
        `;
      } else if (c.type === "benar_salah") {
        const tf = [{ label: "✔ Benar", val: true }, { label: "✕ Salah", val: false }];
        challengeMarkup = `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;">
            ${tf.map((o, i) => {
              let cls = "quiz-opt";
              if (g.cardChecked) {
                if (o.val === c.ans) cls += " correct";
                else if (g.cardSelectedOpt === i) cls += " wrong";
              }
              return `
                <button class="${cls}" style="justify-content:center;" ${g.cardChecked ? "disabled" : ""} onclick="answerGameCardOpt(${i})">
                  <strong>${o.label}</strong>
                </button>
              `;
            }).join("")}
          </div>
        `;
      } else if (c.type === "susun_kata") {
        const bank = getGameCardBank(c.id, c.words);
        const picked = g.cardPickedWords || [];
        challengeMarkup = `
          <div style="margin-top:12px;">
            <div class="word-slots">
              ${picked.length === 0
                ? `<span style="font-size:12.5px;color:var(--text-muted);">Ketuk kata di bawah untuk menyusun kalimat Sirah...</span>`
                : picked.map((bIdx, pIdx) => `
                    <button type="button" class="word-chip picked" ${g.cardChecked ? "disabled" : ""} onclick="unpickGameWord(${pIdx})">${esc(bank[bIdx].w)}</button>
                  `).join("")
              }
            </div>
            <div class="word-bank">
              ${bank.map((item, bIdx) => {
                const used = picked.includes(bIdx);
                return `<button type="button" class="word-chip ${used ? "used" : ""}" ${g.cardChecked || used ? "disabled" : ""} onclick="pickGameWord(${bIdx})">${esc(item.w)}</button>`;
              }).join("")}
            </div>
            ${!g.cardChecked ? `
              <div style="display:flex;gap:8px;margin-top:12px;">
                <button type="button" class="btn btn-outline" style="flex:1;" onclick="resetGameWords()">↺ Ulangi</button>
                <button type="button" class="btn btn-primary" style="flex:2;" ${picked.length < c.words.length ? "disabled" : ""} onclick="checkGameWords()">Periksa Kartu ✔</button>
              </div>
            ` : ""}
          </div>
        `;
      }

      const mult = g.cardMultiplier || 1;
      const basePts = c.pts * mult;
      return `
        <div class="row-between" style="margin-bottom:8px;">
          <span class="pill primary">${esc(c.badge)}${mult > 1 ? " · ★ 2x EMAS" : ""}</span>
          <div class="k3-3d-wrap"><span class="k3-3d-badge"><span class="k3-3d-text">Kelompok 3</span></span></div>
        </div>
        <div style="font-size:12px;color:var(--primary);font-weight:700;">${esc(activePlayer.name)} · Kotak ${activePlayer.pos} · +${basePts} Poin${mult > 1 ? " (2x)" : ""}</div>
        <h2 style="font-size:20px;margin-top:2px;">${esc(c.title)}</h2>
        <p style="font-size:14px;margin-top:6px;">${esc(c.prompt)}</p>

        ${challengeMarkup}

        ${g.cardChecked ? `
          <div style="margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface-var);">
            <strong style="font-size:13.5px;color:var(--primary);">${g.cardCorrect ? `🎆 MasyaAllah Tepat! ${esc(g.lastCardBreakdown || `+${basePts} Poin`)}` : "✕ Belum Tepat (+0 Poin)"}</strong>
            <p style="font-size:13px;margin-top:4px;">${esc(c.exp)}</p>
          </div>
          <button type="button" class="btn btn-primary" style="margin-top:12px;" onclick="closeGameCard()">
            Lanjutkan Giliran →
          </button>
        ` : ""}
      `;
    }

    function renderGameCardModal(updateContentOnly = false) {
      const overlay = document.getElementById("game-card-overlay");
      if (!overlay) return;
      const g = state.game;
      if (g.phase !== "CARD_POP" || !g.activeCard) {
        overlay.classList.remove("open");
        overlay.innerHTML = "";
        return;
      }

      if (updateContentOnly) {
        const frontEl = document.getElementById("game-card-front-content");
        const boxEl = document.getElementById("game-card-3d-box");
        if (frontEl) {
          frontEl.innerHTML = buildCardChallengeHtml();
          if (boxEl) {
            boxEl.classList.remove("card-wrong-shake");
            if (g.cardWrongShake) {
              void boxEl.offsetWidth;
              boxEl.classList.add("card-wrong-shake");
              g.cardWrongShake = false;
            }
          }
          return;
        }
      }

      const shouldFlip = g.cardFlipPending;
      g.cardFlipPending = false;
      overlay.innerHTML = `
        <canvas id="fireworks-canvas" class="fireworks-canvas"></canvas>
        <div id="game-card-3d-box" class="game-card-3d">
          <div class="game-card-inner ${shouldFlip ? "flip-once" : ""}">
            <div class="game-card-back">
              <div style="font-size:36px;">🕋</div>
              <div class="k3-3d-wrap"><span class="k3-3d-badge"><span class="k3-3d-text">Kelompok 3 · 3D</span></span></div>
              <div style="font-size:13px;opacity:0.85;">Kartu Sirah Nabi</div>
            </div>
            <div id="game-card-front-content" class="game-card-front">
              ${buildCardChallengeHtml()}
            </div>
          </div>
        </div>
      `;
      overlay.classList.add("open");

    function startGameMatch() {
      clearTimeout(diceRollTimeout);
      clearInterval(stepInterval);
      const g = state.game;
      g.players = createPlayers(g.mode, g.groupCount, g.groupNames);
      g.turnIdx = 0;
      g.round = 1;
      g.finishTriggered = false;
      g.deck = buildShuffledDeck();
      g.deckPtr = 0;
      g.lastRoll = 1;
      g.diceRot = { x: 0, y: 0, z: 0 };
      g.prevDiceRot = { x: 0, y: 0, z: 0 };
      g.diceRollingStart = false;
      g.phase = "IDLE";
      g.activeCard = null;
      g.cardFlipPending = false;
      g.cardWrongShake = false;
      g.cardMultiplier = 1;
      g.lastCardBreakdown = "";

      syncGameMusic();
      render();
    }

    let diceRollTimeout = null;
    let stepInterval = null;
    function rollDice3D() {
      const g = state.game;
      if (g.phase !== "IDLE") return;
      const activePlayer = g.players[g.turnIdx];
      const roll = Math.floor(Math.random() * 6) + 1;
      const faceAngles = {
        1: { x: 0, y: 0 },
        2: { x: 0, y: -90 },
        3: { x: -90, y: 0 },
        4: { x: 90, y: 0 },
        5: { x: 0, y: 90 },
        6: { x: 0, y: 180 }
      };
      const base = faceAngles[roll];
      const extraX = 360 * (Math.floor(Math.random() * 2) + 3);
      const extraY = 360 * (Math.floor(Math.random() * 2) + 3);
      const extraZ = 360 * 2;
      const prevSpinX = Math.floor(g.diceRot.x / 360) * 360;
      const prevSpinY = Math.floor(g.diceRot.y / 360) * 360;
      const prevSpinZ = Math.floor((g.diceRot.z || 0) / 360) * 360;

      g.prevDiceRot = { ...g.diceRot };
      g.diceRollingStart = true;
      g.phase = "ROLLING";
      g.lastRoll = roll;
      g.diceRot = {
        x: prevSpinX + extraX + base.x,
        y: prevSpinY + extraY + base.y,
        z: prevSpinZ + extraZ
      };
      playFx("diceFly");
      render();

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          g.diceRollingStart = false;
          const cube = document.getElementById("dice-cube-3d");
          if (cube) {
            cube.style.transform = `rotateX(${g.diceRot.x}deg) rotateY(${g.diceRot.y}deg) rotateZ(${g.diceRot.z}deg)`;
          }
        });
      });

      clearTimeout(diceRollTimeout);
      clearTimeout(diceCardDelayTimeout);
      g.tileNotice = "";
      g.cardMultiplier = 1;
      diceRollTimeout = setTimeout(() => {
        const target = Math.min(16, activePlayer.pos + roll);
        g.phase = "MOVING";
        render();

        clearInterval(stepInterval);
        stepInterval = setInterval(() => {
          if (activePlayer.pos < target) {
            activePlayer.pos += 1;
            playFx("hop");
            render();
          }
          if (activePlayer.pos >= target) {
            clearInterval(stepInterval);
            if (activePlayer.pos >= 16 && !activePlayer.finished) {
              activePlayer.finished = true;
              activePlayer.score += 20;
              g.finishTriggered = true;
            }
            const landed = BOARD_TILES[activePlayer.pos - 1];
            if (landed && landed.special === "bonus") {
              activePlayer.score += 10;
              g.tileNotice = `✨ ${landed.name}! ${activePlayer.name} meraih +10 Poin Berkah!`;
              playFx("win");
              render();
              diceCardDelayTimeout = setTimeout(() => openNextDeckCard(), 650);
            } else if (landed && landed.special === "advance") {
              g.tileNotice = `🐪 ${landed.name}! ${activePlayer.name} melaju +1 langkah ekstra!`;
              playFx("card");
              render();
              diceCardDelayTimeout = setTimeout(() => {
                if (activePlayer.pos < 16) {
                  activePlayer.pos += 1;
                  playFx("hop");
                  if (activePlayer.pos >= 16 && !activePlayer.finished) {
                    activePlayer.finished = true;
                    activePlayer.score += 20;
                    g.finishTriggered = true;
                  }
                  render();
                }
                diceCardDelayTimeout = setTimeout(() => openNextDeckCard(), 480);
              }, 480);
            } else if (landed && landed.special === "double") {
              g.cardMultiplier = 2;
              g.tileNotice = `🏛️ Tantangan Emas di ${landed.name}! Poin kartu berikutnya 2x lipat!`;
              playFx("card");
              render();
              diceCardDelayTimeout = setTimeout(() => openNextDeckCard(), 600);
            } else {
              diceCardDelayTimeout = setTimeout(() => openNextDeckCard(), 280);
            }
          }
        }, 280);
      }, 1260);
    }

    function openNextDeckCard() {
      const g = state.game;
      if (g.deckPtr >= g.deck.length) {
        g.deck = buildShuffledDeck();
        g.deckPtr = 0;
      }
      const card = g.deck[g.deckPtr++];
      g.phase = "CARD_POP";
      g.activeCard = card;
      g.cardFlipPending = true;
      g.cardWrongShake = false;
      g.cardPickedWords = [];
      g.cardSelectedOpt = null;
      g.cardChecked = false;
      g.cardCorrect = false;
      g.lastCardBreakdown = "";
      playFx("card");
      renderGameCardModal(false);
    }

    function answerGameCardOpt(optIdx) {
      const g = state.game;
      if (g.cardChecked || !g.activeCard) return;
      const c = g.activeCard;
      const p = g.players[g.turnIdx];
      const isOk = c.type === "benar_salah" ? ((optIdx === 0) === c.ans) : (optIdx === c.ans);
      g.cardSelectedOpt = optIdx;
      g.cardChecked = true;
      g.cardCorrect = isOk;
      g.cardWrongShake = !isOk;
      p.answered += 1;
      if (isOk) {
        const mult = g.cardMultiplier || 1;
        const basePts = c.pts * mult;
        p.streak = (p.streak || 0) + 1;
        p.bestStreak = Math.max(p.bestStreak || 0, p.streak);
        const comboBonus = p.streak >= 2 ? 5 : 0;
        const totalEarned = basePts + comboBonus;
        p.score += totalEarned;
        p.correct += 1;
        g.lastCardBreakdown = `+${totalEarned} Poin${mult > 1 ? " (2x Emas)" : ""}${comboBonus ? ` (termasuk +${comboBonus} Kombo ${p.streak}x!)` : ""}`;
        playFx("win");
        launchFireworks(3);
      } else {
        p.streak = 0;
        g.lastCardBreakdown = "";
        playFx("wrong");
      }
      renderGameCardModal(true);
    }

    function pickGameWord(bIdx) {
      const g = state.game;
      if (g.cardChecked || g.cardPickedWords.includes(bIdx)) return;
      g.cardPickedWords = [...g.cardPickedWords, bIdx];
      playFx("wordTap");
      renderGameCardModal(true);
    }

    function unpickGameWord(posIdx) {
      const g = state.game;
      if (g.cardChecked) return;
      g.cardPickedWords = g.cardPickedWords.filter((_, i) => i !== posIdx);
      playFx("wordTap");
      renderGameCardModal(true);
    }

    function resetGameWords() {
      state.game.cardPickedWords = [];
      renderGameCardModal(true);
    }

    function checkGameWords() {
      const g = state.game;
      if (g.cardChecked || !g.activeCard) return;
      const p = g.players[g.turnIdx];
      const bank = getGameCardBank(g.activeCard.id, g.activeCard.words);
      const assembled = g.cardPickedWords.map(bIdx => bank[bIdx].w).join(" ");
      const target = g.activeCard.words.join(" ");
      const isOk = assembled === target;
      g.cardChecked = true;
      g.cardCorrect = isOk;
      g.cardWrongShake = !isOk;
      p.answered += 1;
      if (isOk) {
        const mult = g.cardMultiplier || 1;
        const basePts = g.activeCard.pts * mult;
        p.streak = (p.streak || 0) + 1;
        p.bestStreak = Math.max(p.bestStreak || 0, p.streak);
        const comboBonus = p.streak >= 2 ? 5 : 0;
        const totalEarned = basePts + comboBonus;
        p.score += totalEarned;
        p.correct += 1;
        g.lastCardBreakdown = `+${totalEarned} Poin${mult > 1 ? " (2x Emas)" : ""}${comboBonus ? ` (termasuk +${comboBonus} Kombo ${p.streak}x!)` : ""}`;
        playFx("win");
        launchFireworks(3);
      } else {
        p.streak = 0;
        g.lastCardBreakdown = "";
        playFx("wrong");
      }
      renderGameCardModal(true);
    }

    function closeGameCard() {
      const g = state.game;
      g.activeCard = null;
      g.cardMultiplier = 1;
      g.tileNotice = "";
      const isEndOfRound = g.turnIdx >= g.players.length - 1;
      if (isEndOfRound && g.finishTriggered) {
        g.phase = "VICTORY";
        renderGameCardModal();
        finishGameVictory();
        render();
        return;
      }
      if (isEndOfRound) {
        g.turnIdx = 0;
        g.round += 1;
      } else {
        g.turnIdx += 1;
      }
      g.phase = "IDLE";
      renderGameCardModal();
      render();
    }

    function saveScoreToBest(players, gameId = "dice", gameTitle = "Kartu & Dadu 3D") {
      const ranked = [...players].sort((a, b) => (b.score - a.score) || (b.correct - a.correct));
      const topScore = ranked[0] ? ranked[0].score : 0;
      const topStreak = Math.max(0, ...players.map(p => p.bestStreak || 0));

      state.saved.gamesWon = (state.saved.gamesWon || 0) + 1;
      if (topScore > (state.saved.bestGameScore || 0)) {
        state.saved.bestGameScore = topScore;
      }

      if (!Array.isArray(state.saved.playedGames)) state.saved.playedGames = [];
      if (gameId && !state.saved.playedGames.includes(gameId)) {
        state.saved.playedGames.push(gameId);
      }

      if (!Array.isArray(state.saved.badges)) state.saved.badges = [];
      const unlockedBefore = new Set(state.saved.badges);
      const tryUnlock = (id, cond) => {
        if (cond && !state.saved.badges.includes(id)) state.saved.badges.push(id);
      };
      tryUnlock("first_win", true);
      tryUnlock("score_100", topScore >= 100);
      tryUnlock("streak_3", topStreak >= 3);
      tryUnlock("all_games", state.saved.playedGames.length >= 6);
      tryUnlock("buzzer_champ", gameId === "buzzer" && topScore > 0);
      tryUnlock("scholar_terms", gameId === "terms" && topScore > 0);
      state.game.lastNewBadges = state.saved.badges.filter(id => !unlockedBefore.has(id));

      if (!Array.isArray(state.saved.hallOfFame)) state.saved.hallOfFame = [];
      const nowD = new Date();
      const dateStr = `${nowD.getDate()}/${nowD.getMonth() + 1} ${String(nowD.getHours()).padStart(2, "0")}:${String(nowD.getMinutes()).padStart(2, "0")}`;
      const winners = ranked.filter(p => p.score === topScore);
      const winnerLabel = winners.length > 1
        ? `Seri (${winners.map(w => w.name).join(" & ")})`
        : (ranked[0] ? ranked[0].name : "Peserta");
      state.saved.hallOfFame.unshift({
        gameId,
        gameTitle,
        winnerName: winnerLabel,
        score: topScore,
        modeLabel: state.game.mode === "solo" ? "Solo" : `${players.length} Kelompok`,
        dateStr
      });
      state.saved.hallOfFame = state.saved.hallOfFame.slice(0, 10);

      saveState();
      syncGameMusic();
      playFx("victory");
      launchFireworks(4);
    }

    function finishGameVictory() {
      saveScoreToBest(state.game.players, "dice", "Kartu & Dadu 3D");
    }

       GAME 2: MEMORI PASANGAN 3D

      state.mem.setId = setId;
      render();
    }

      clearTimeout(memFlipTimeout);
      state.mem.phase = "SETUP";
      syncGameMusic();

    function startMemMatch() {
      clearTimeout(memFlipTimeout);
      const g = state.game;
      const m = state.mem;
      m.players = createPlayers(g.mode, g.groupCount, g.groupNames);
      m.turnIdx = 0;
      m.flippedIds = [];
      m.shakingIds = [];
      m.locked = false;
      m.flipsCount = 0;
      m.streak = 0;
      m.turnMatches = 0;
      m.bannerMsg = "Buka 2 kartu untuk mencari pasangan Sirah yang cocok!";

      let pairs = [];
      if (m.setId === "mix") {
        const all = MEM_PAIR_SETS.flatMap(s => s.pairs);
        pairs = shuffleList(all).slice(0, 6);
      } else {
        const chosen = MEM_PAIR_SETS.find(s => s.id === m.setId) || MEM_PAIR_SETS[0];
        pairs = chosen.pairs;
      }

      const rawCards = [];
      pairs.forEach(p => {
        rawCards.push({ uid: `${p.id}_a`, pairId: p.id, kind: "Istilah / Tokoh", text: p.a, fact: p.fact, matched: false, matchedBy: null });
        rawCards.push({ uid: `${p.id}_b`, pairId: p.id, kind: "Keterangan Sirah", text: p.b, fact: p.fact, matched: false, matchedBy: null });
      });
      m.cards = shuffleList(rawCards);
      m.phase = "PLAY";
      syncGameMusic();
      render();
    }

    function updateMemCardsDom() {
      const m = state.mem;
      m.cards.forEach(c => {
        const btn = document.getElementById(`mem-card-${c.uid}`);
        if (!btn) return;
        const isOpen = c.matched || m.flippedIds.includes(c.uid);
        const isShaking = m.shakingIds.includes(c.uid);
        btn.className = `mem-card ${isOpen ? "is-open" : ""} ${c.matched ? "is-matched" : ""} ${isShaking ? "is-shaking" : ""}`;
        btn.disabled = c.matched || m.locked || m.flippedIds.includes(c.uid);
      });
      const banner = document.getElementById("mem-banner");
      if (banner) banner.textContent = m.bannerMsg;
      const subline = document.getElementById("mem-subline");
      if (subline) {
        const currP = m.players[m.turnIdx] || m.players[0];
        subline.textContent = state.game.mode === "solo" ? `Percobaan: ${m.flipsCount}x` : `Giliran ${currP.name}`;
      }
      const playersBar = document.getElementById("mem-players-bar");
      if (playersBar) {
        playersBar.innerHTML = m.players.map((p, idx) => `
          <div class="player-pill-card ${idx === m.turnIdx ? 'turn-now' : ''}">
            <span class="player-dot" style="background:${p.color};">${esc(p.code)}</span>
            <div style="flex:1;min-width:0;">
              <div style="font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(p.name)}</div>
              <div style="font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;">${p.correct} Pasang · <strong>${p.score} pt</strong></div>
            </div>
          </div>
        `).join("");
      }
    }

    function flipMemCard(uid) {
      const m = state.mem;
      if (m.phase !== "PLAY" || m.locked) return;
      const card = m.cards.find(c => c.uid === uid);
      if (!card || card.matched || m.flippedIds.includes(uid)) return;

      m.flippedIds = [...m.flippedIds, uid];
      playFx("wordTap");
      updateMemCardsDom();

      if (m.flippedIds.length < 2) return;

      m.locked = true;
      m.flipsCount += 1;
      const [id1, id2] = m.flippedIds;
      const c1 = m.cards.find(c => c.uid === id1);
      const c2 = m.cards.find(c => c.uid === id2);
      const currPlayer = m.players[m.turnIdx];
      currPlayer.answered += 1;

      if (c1 && c2 && c1.pairId === c2.pairId) {
        c1.matched = true;
        c2.matched = true;
        c1.matchedBy = currPlayer.id;
        c2.matchedBy = currPlayer.id;
        currPlayer.correct += 1;
        m.streak += 1;
        m.turnMatches += 1;
        const pts = 20 + Math.min(10, (m.streak - 1) * 5);
        currPlayer.score += pts;
        playFx("win");
        launchFireworks(2);

        const allDone = m.cards.every(c => c.matched);
        if (allDone) {
          m.flippedIds = [];
          m.locked = false;
          setTimeout(() => {
            m.phase = "VICTORY";
            m.players.forEach(p => { p.bestStreak = Math.max(p.bestStreak || 0, m.streak); });
            saveScoreToBest(m.players, "memory", "Memori Pasangan 3D");
            render();
          }, 700);
          return;
        }

        const isGroup = state.game.mode === "group";
        if (isGroup && m.turnMatches >= 2) {
          m.turnIdx = (m.turnIdx + 1) % m.players.length;
          m.turnMatches = 0;
          m.bannerMsg = `🎆 Cocok (+${pts} pt)! ${c1.fact} (Giliran adil pindah ke ${m.players[m.turnIdx].name})`;
        } else {
          m.bannerMsg = `🎆 Cocok (+${pts} pt)! ${c1.fact}`;
        }
        m.flippedIds = [];
        m.locked = false;
        updateMemCardsDom();
      } else {
        m.streak = 0;
        m.turnMatches = 0;
        m.shakingIds = [id1, id2];
        playFx("wrong");
        m.bannerMsg = "✕ Belum cocok! Ingat posisi kartunya baik-baik.";
        updateMemCardsDom();

        memFlipTimeout = setTimeout(() => {
          m.flippedIds = [];
          m.shakingIds = [];
          m.locked = false;
          if (state.game.mode === "group") {
            m.turnIdx = (m.turnIdx + 1) % m.players.length;
            m.bannerMsg = `Giliran ${m.players[m.turnIdx].name} membuka 2 kartu!`;
          } else {
            m.bannerMsg = "Coba pasangkan 2 kartu Sirah yang sesuai!";
          }
          updateMemCardsDom();
        }, 880);
      }
    }

    function renderMemGame() {

              <div class="player-pill-card ${idx === m.turnIdx ? 'turn-now' : ''}">
                <span class="player-dot" style="background:${p.color};">${esc(p.code)}</span>
                <div style="flex:1;min-width:0;">
                  <div style="font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(p.name)}</div>
                  <div style="font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;">${p.correct} Pasang · <strong>${p.score} pt</strong></div>

    /* ============================================================
       GAME 3: SUSUN JEJAK KRONOLOGI
       ============================================================ */
    function openChronoSetup() {
      state.chrono.phase = "SETUP";
      syncGameMusic();
      render();
    }
    function loadNextChronoPuzzle() {
      const ch = state.chrono;
      if (ch.poolPtr >= ch.pool.length) {
        ch.pool = shuffleList(CHRONO_ROUNDS);
        ch.poolPtr = 0;
      }
      const puzzle = ch.pool[ch.poolPtr++];
      ch.currPuzzle = puzzle;
      ch.bank = shuffleWords(puzzle.events);
      ch.slots = [null, null, null, null, null];
      ch.checked = false;
      ch.slotResults = [];
      ch.roundScore = 0;
    }
    function startChronoMatch() {
      const g = state.game;
      const ch = state.chrono;
      ch.players = createPlayers(g.mode, g.groupCount, g.groupNames);
      ch.turnIdx = 0;
      ch.round = 1;
      ch.totalRounds = g.mode === "solo" ? 3 : 2;
      ch.pool = shuffleList(CHRONO_ROUNDS);
      ch.poolPtr = 0;
      loadNextChronoPuzzle();
      ch.phase = "PLAY";
      syncGameMusic();
      render();
    }
    function pickChronoEvent(bankIdx) {
      const ch = state.chrono;
      if (ch.checked || ch.slots.includes(bankIdx)) return;
      const emptyPos = ch.slots.findIndex(v => v === null);
      if (emptyPos < 0) return;
      ch.slots[emptyPos] = bankIdx;
      playFx("wordTap");
      render();
    }
    function unpickChronoSlot(slotPos) {
      const ch = state.chrono;
      if (ch.checked || ch.slots[slotPos] === null) return;
      ch.slots[slotPos] = null;
      playFx("wordTap");
      render();
    }
    function resetChronoSlots() {
      if (state.chrono.checked) return;
      state.chrono.slots = [null, null, null, null, null];
      render();
    }
    function checkChronoOrder() {
      const ch = state.chrono;
      if (ch.checked || ch.slots.some(v => v === null)) return;
      const p = ch.players[ch.turnIdx];
      let exactCount = 0;
      ch.slotResults = ch.slots.map((bIdx, pos) => {
        const isExact = ch.bank[bIdx].i === pos;
        if (isExact) exactCount += 1;
        return isExact;
      });
      const perfect = exactCount === ch.slots.length;
      const pts = exactCount * 15 + (perfect ? 25 : 0);
      p.score += pts;
      p.answered += ch.slots.length;
      p.correct += exactCount;
      ch.checked = true;
      ch.roundScore = pts;

      if (perfect) {
        playFx("win");
        launchFireworks(3);
      } else if (exactCount >= 3) {
        playFx("hop");
      } else {
        playFx("wrong");
      }
      render();
    }
    function nextChronoTurn() {
      const ch = state.chrono;
      const isLastPlayer = ch.turnIdx >= ch.players.length - 1;
      if (isLastPlayer && ch.round >= ch.totalRounds) {
        ch.phase = "VICTORY";
        saveScoreToBest(ch.players, "chrono", "Susun Jejak Kronologi");
        render();
        return;
      }
      if (isLastPlayer) {
        ch.turnIdx = 0;
        ch.round += 1;
      } else {
        ch.turnIdx += 1;
      }
      loadNextChronoPuzzle();
      render();
    }
    function renderChronoGame() {
      const g = state.game;
      const ch = state.chrono;
      if (ch.phase === "SETUP") {
        return `
          <div class="container stack">
            <div class="game-top-bar">

    function openBlitzSetup() {

    function startBlitzTimer() {
      clearInterval(blitzTimerInterval);
      const b = state.blitz;
      b.timeLeft = b.maxTime;
      blitzTimerInterval = setInterval(() => {
        if (state.tab !== "game" || state.activeGame !== "blitz" || b.phase !== "PLAY" || b.answered) {
          clearInterval(blitzTimerInterval);
          return;
        }
        b.timeLeft = Math.max(0, b.timeLeft - 1);
        const bar = document.getElementById("blitz-timer-fill");
        const txt = document.getElementById("blitz-timer-txt");
        if (bar) {
          bar.style.width = `${Math.round((b.timeLeft / b.maxTime) * 100)}%`;
          bar.classList.toggle("low", b.timeLeft <= 4);
        }
        if (txt) txt.textContent = `${b.timeLeft} dtk`;
        if (b.timeLeft <= 0) {
          clearInterval(blitzTimerInterval);
          answerBlitzOpt(-1);
        }
      }, 1000);
    }
    function startBlitzMatch() {
      clearInterval(blitzTimerInterval);
      const g = state.game;
      const b = state.blitz;
      b.players = createPlayers(g.mode, g.groupCount, g.groupNames);
      b.turnIdx = 0;
      b.qIndex = 0;
      const perPlayer = g.mode === "solo" ? 8 : (g.groupCount === 4 ? 2 : 3);
      b.totalQuestions = b.players.length * perPlayer;
      b.questions = shuffleList(BLITZ_QUESTIONS).slice(0, b.totalQuestions);
      b.maxTime = g.mode === "solo" ? 12 : 15;
      b.timeLeft = b.maxTime;
      b.streak = 0;
      b.selectedOpt = null;
      b.answered = false;
      b.lastPts = 0;
      b.shakeNow = false;
      b.phase = "PLAY";
      syncGameMusic();
      render();
      startBlitzTimer();
    }
    function answerBlitzOpt(optIdx) {
      const b = state.blitz;
      if (b.answered || b.phase !== "PLAY") return;
      clearInterval(blitzTimerInterval);
      const q = b.questions[b.qIndex];
      const p = b.players[b.turnIdx];
      const isOk = optIdx === q.ans;
      b.selectedOpt = optIdx;
      b.answered = true;
      p.answered += 1;

        if (isOk) {
        b.streak += 1;
        p.bestStreak = Math.max(p.bestStreak || 0, b.streak);
        const speedBonus = Math.ceil(b.timeLeft / 2);
        const streakBonus = Math.min(10, (b.streak - 1) * 5);
        const pts = 15 + speedBonus + streakBonus;
        p.score += pts;
        p.correct += 1;
        b.lastPts = pts;
        b.shakeNow = false;
        playFx("win");
        launchFireworks(2);
      } else {
        b.streak = 0;
        b.lastPts = 0;
        b.shakeNow = true;
        playFx("wrong");
      }
      render();
    }

              <div>
                <h1 style="font-size:20px;">Buzzer Rebutan Sirah</h1>
                <p style="font-size:11.5px;color:var(--text-muted);">Soal ${bz.qIndex + 1}/${bz.totalQuestions} · ${bz.stage === "WAIT_BUZZ" ? "Siapa cepat tekan Buzzer!" : bz.stage === "ANSWER" ? `Giliran ${esc(buzzedPlayer ? buzzedPlayer.name : "")}` : "Pembahasan Soal"}</p>
              </div>
            </div>
            ${renderGameActionButtons("openBuzzerSetup")}
          </div>

          <div class="players-bar">
            ${bz.players.map((p, idx) => `
              <div class="player-pill-card ${idx === bz.activeBuzzerIdx ? 'turn-now' : ''}">
                <span class="player-dot" style="background:${p.color};">${esc(p.code)}</span>
                <div style="flex:1;min-width:0;">
                  <div style="font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(p.name)}</div>
                  <div style="font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;">Benar ${p.correct} · <strong>${p.score} pt</strong></div>
                </div>
              </div>
            `).join("")}
          </div>

          <div class="card stack ${bz.shakeNow ? 'blitz-card-shake' : ''}" style="padding:18px;">
            ${bz.stage === "ANSWER" ? `
              <div class="row-between">
                <span class="pill primary" style="background:${buzzedPlayer ? buzzedPlayer.color : ''};color:#fff;">🛎️ ${esc(buzzedPlayer ? buzzedPlayer.name : "Peserta")} Menjawab</span>
                <strong id="buzzer-timer-txt" style="font-size:14px;color:${bz.timeLeft <= 3 ? '#F87171' : 'var(--primary)'};font-variant-numeric:tabular-nums;">${bz.timeLeft} dtk</strong>
              </div>
              <div class="blitz-timer-track">
                <div id="buzzer-timer-fill" class="blitz-timer-fill ${bz.timeLeft <= 3 ? 'low' : ''}" style="width:${pct}%;"></div>
              </div>
            ` : `
              <div class="row-between">
                <span class="pill primary">🛎️ ${bz.stage === "WAIT_BUZZ" ? "Adu Cepat Tekan Buzzer!" : "Jawaban & Penjelasan"}</span>
                <span style="font-size:12px;color:var(--text-muted);font-weight:700;">+20 Poin (+5 Cepat)</span>
              </div>
            `}

            ${bz.feedbackMsg ? `
              <div style="padding:9px 12px;border-radius:12px;background:var(--surface-var);font-size:12.5px;font-weight:700;color:var(--primary);">
                ${esc(bz.feedbackMsg)}
              </div>
            ` : ""}

            <h2 style="font-size:19px;">${esc(q.q)}</h2>

            ${bz.stage === "WAIT_BUZZ" ? `
              <div class="buzzer-pad-grid">
                ${bz.players.map((p, idx) => {
                  const isLocked = bz.lockedIds.includes(p.id);
                  return `
                    <button type="button" class="buzzer-btn" style="background:${p.color};" ${isLocked ? "disabled" : ""} onclick="pressGroupBuzzer(${idx})">
                      <span style="font-size:20px;">🛎️</span>
                      <span>${esc(p.name)}</span>
                      <span class="buzzer-key-hint">${isLocked ? "Terkunci" : `Tombol [${idx + 1}]`}</span>
                    </button>
                  `;
                }).join("")}
              </div>
              <button type="button" class="btn btn-outline" style="min-height:38px;" onclick="skipBuzzerQuestion()">Lewati Soal →</button>
            ` : `
              <div class="stack" style="gap:8px;">
                ${q.opts.map((opt, i) => {
                  let cls = "quiz-opt";
                  if (bz.stage === "REVEAL") {
                    if (i === q.ans) cls += " correct";
                    else if (i === bz.selectedOpt) cls += " wrong";
                  }
                  return `
                    <button class="${cls}" ${bz.stage !== "ANSWER" ? "disabled" : ""} onclick="answerBuzzerOpt(${i})">
                      <span class="opt-letter">${String.fromCharCode(65 + i)}</span>
                      <span style="flex:1;">${esc(opt)}</span>
                      ${bz.stage === "REVEAL" && i === q.ans ? "<span>✔</span>" : bz.stage === "REVEAL" && i === bz.selectedOpt && i !== q.ans ? "<span>✕</span>" : ""}
                    </button>
                  `;
                }).join("")}
              </div>
            `}

            ${bz.stage === "REVEAL" ? `
              <div style="padding:12px 14px;border-radius:14px;background:var(--surface-var);font-size:13px;">
                <strong style="color:var(--primary);">Penjelasan Sirah:</strong>
                <p style="margin-top:4px;">${esc(q.exp)}</p>
              </div>
              <button type="button" class="btn btn-primary" onclick="nextBuzzerQuestion()">
                ${bz.qIndex >= bz.totalQuestions - 1 ? "Lihat Peringkat Akhir 🏆" : "Soal Rebutan Berikutnya →"}
              </button>
            ` : ""}
          </div>
        </div>
      `;
    }

    /* ============================================================
       GAME 6: MAKNA ISTILAH SIRAH
       ============================================================ */
    function openTermsSetup() {
      state.terms.phase = "SETUP";
      syncGameMusic();
      render();
    }
    function buildTermQuestions(totalCount) {
      const basePool = shuffleList(SIRAH_TERMS);
      const list = [];
      for (let i = 0; i < totalCount; i++) {
        const item = basePool[i % basePool.length];
        const distractors = shuffleList(SIRAH_TERMS.filter(x => x.term !== item.term)).slice(0, 3);
        const rawOpts = shuffleList([
          { text: item.meaning, isAns: true },
          ...distractors.map(d => ({ text: d.meaning, isAns: false }))
        ]);
        list.push({
          term: item.term,
          hint: item.hint,
          meaning: item.meaning,
          opts: rawOpts.map(o => o.text),
          ans: rawOpts.findIndex(o => o.isAns)
        });
      }
      return list;
    }
    function startTermsMatch() {
      const g = state.game;
      const t = state.terms;
      t.players = createPlayers(g.mode, g.groupCount, g.groupNames);
      t.turnIdx = 0;
      t.qIndex = 0;
      const perPlayer = g.mode === "solo" ? 8 : (g.groupCount === 4 ? 2 : 3);
      t.totalQuestions = t.players.length * perPlayer;
      t.questions = buildTermQuestions(t.totalQuestions);
      t.streak = 0;
      t.selectedOpt = null;
      t.answered = false;
      t.lastPts = 0;
      t.shakeNow = false;
      t.phase = "PLAY";
      syncGameMusic();
      render();
    }
    function answerTermOpt(optIdx) {
      const t = state.terms;
      if (t.answered || t.phase !== "PLAY") return;
      const q = t.questions[t.qIndex];
      const p = t.players[t.turnIdx];
      t.selectedOpt = optIdx;
      t.answered = true;
      p.answered += 1;
      if (optIdx === q.ans) {
        t.streak += 1;
        p.streak = (p.streak || 0) + 1;
        p.bestStreak = Math.max(p.bestStreak || 0, p.streak);
        const combo = Math.min(10, (p.streak - 1) * 5);
        const pts = 20 + combo;
        p.score += pts;
        p.correct += 1;
        t.lastPts = pts;
        t.shakeNow = false;
        playFx("win");
        launchFireworks(2);
      } else {
        t.streak = 0;
        p.streak = 0;
        t.lastPts = 0;
        t.shakeNow = true;
        playFx("wrong");
      }
      render();
    }
    function nextTermQuestion() {
      const t = state.terms;
      if (t.qIndex >= t.totalQuestions - 1) {
        t.phase = "VICTORY";
        saveScoreToBest(t.players, "terms", "Makna Istilah Sirah");
        render();
        return;
      }
      t.qIndex += 1;
      t.turnIdx = (t.turnIdx + 1) % t.players.length;
      t.selectedOpt = null;
      t.answered = false;
      t.lastPts = 0;
      t.shakeNow = false;
      render();
    }
    function renderTermsGame() {
      const g = state.game;
      const t = state.terms;
      if (t.phase === "SETUP") {
        return `
          <div class="container stack">
            <div class="game-top-bar">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <button type="button" class="chip" onclick="selectArcadeGame('hub')">← Daftar Game</button>
                <h1 style="font-size:22px;">Makna Istilah Sirah</h1>
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                ${renderGameActionButtons(null)}
                <div class="k3-3d-wrap"><span class="k3-3d-badge"><span class="k3-3d-text">Kelompok 3 · 3D</span></span></div>
              </div>
            </div>
            ${renderSharedModeSetupCard(
              "Makna Istilah Sirah",
              `• Cocokkan istilah-istilah Sirah ('Amul Fil, Syaqqush Shadr, Qirath, Al-Amin, dll) dengan maknanya yang tepat.<br/>
               • Jawaban benar bernilai <strong>+20 poin + bonus kombo beruntun</strong>.<br/>
               • Jumlah giliran sama rata untuk semua kelompok.`,
              "startTermsMatch"
            )}
          </div>
        `;
      }
      if (t.phase === "VICTORY") {
        const ranked = [...t.players].sort((a, b) => (b.score - a.score) || (b.correct - a.correct));
        const topScore = ranked[0].score;
        const winners = ranked.filter(p => p.score === topScore);
        const headline = g.mode === "solo"
          ? `Skor Istilah: ${ranked[0].score} Poin`
          : winners.length > 1
            ? `Seri Adil! (${topScore} Poin)`
            : `Ahli Istilah: ${esc(winners[0].name)} (${topScore} Poin)`;
        return renderFairLeaderboard(
          t.players,
          headline,
          `${t.totalQuestions} istilah Sirah selesai ditebak adil.`,
          p => `Benar ${p.correct}/${p.answered}`,
          "openTermsSetup",
          "startTermsMatch",
          "📜 Main Lagi"
        );
      }

      const activePlayer = t.players[t.turnIdx] || t.players[0];
      const q = t.questions[t.qIndex];
      return `
        <div class="container stack">
          <div class="row-between" style="flex-wrap:wrap;gap:8px;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <button type="button" class="chip" onclick="selectArcadeGame('hub')">← Game</button>
              <div>
                <h1 style="font-size:20px;">Makna Istilah Sirah</h1>
                <p style="font-size:11.5px;color:var(--text-muted);">Istilah ${t.qIndex + 1}/${t.totalQuestions} · ${g.mode === "solo" ? "Mode Solo" : `Giliran ${esc(activePlayer.name)}`}</p>
              </div>
            </div>
            ${renderGameActionButtons("openTermsSetup")}
          </div>

          <div class="players-bar">
            ${t.players.map((p, idx) => `
              <div class="player-pill-card ${idx === t.turnIdx ? 'turn-now' : ''}">
                <span class="player-dot" style="background:${p.color};">${esc(p.code)}</span>
                <div style="flex:1;min-width:0;">
                  <div style="font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(p.name)}</div>
                  <div style="font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;">Benar ${p.correct} · <strong>${p.score} pt</strong></div>
                </div>
              </div>
            `).join("")}
          </div>

          <div class="card stack ${t.shakeNow ? 'blitz-card-shake' : ''}" style="padding:18px;">
            <div class="term-showcase">
              <span class="pill primary">${esc(q.hint)}</span>
              <div class="term-word">${esc(q.term)}</div>
              <p style="font-size:12.5px;color:var(--text-muted);margin-top:4px;">Pilih arti yang paling tepat untuk istilah Sirah di atas:</p>
            </div>

            <div class="stack" style="gap:8px;">
              ${q.opts.map((opt, i) => {
                let cls = "quiz-opt";
                if (t.answered) {
                  if (i === q.ans) cls += " correct";
                  else if (i === t.selectedOpt) cls += " wrong";
                }
                return `
                  <button class="${cls}" ${t.answered ? "disabled" : ""} onclick="answerTermOpt(${i})">
                    <span class="opt-letter">${String.fromCharCode(65 + i)}</span>
                    <span style="flex:1;font-size:13.5px;">${esc(opt)}</span>
                    ${t.answered && i === q.ans ? "<span>✔</span>" : t.answered && i === t.selectedOpt && i !== q.ans ? "<span>✕</span>" : ""}
                  </button>
                `;
              }).join("")}
            </div>

            ${t.answered ? `
              <div style="padding:12px 14px;border-radius:14px;background:var(--surface-var);font-size:13px;">
                <strong style="color:var(--primary);">${t.lastPts > 0 ? `🎆 Tepat Sekali! +${t.lastPts} Poin` : "✕ Belum Tepat (+0 Poin)"}</strong>
                <p style="margin-top:4px;"><strong>${esc(q.term)}:</strong> ${esc(q.meaning)}</p>
              </div>
              <button type="button" class="btn btn-primary" onclick="nextTermQuestion()">
                ${t.qIndex >= t.totalQuestions - 1 ? "Lihat Peringkat Akhir 🏆" : "Istilah Berikutnya →"}
              </button>
            ` : ""}
          </div>
        </div>
      `;
    }

    document.addEventListener("keydown", (ev) => {
      if (state.tab !== "game" || state.activeGame !== "buzzer" || state.buzzer.phase !== "PLAY" || state.buzzer.stage !== "WAIT_BUZZ") return;
      if (["1", "2", "3", "4"].includes(ev.key)) {
        const idx = Number(ev.key) - 1;
        if (idx < state.buzzer.players.length) {
          ev.preventDefault();
          pressGroupBuzzer(idx);
        }
      }
    });

    function switchTab(tab) {
      stopKronologiTour();
      stopSpeech();
      clearAllGameTimers();
      if (state.game.phase === "ROLLING" || state.game.phase === "MOVING") state.game.phase = "IDLE";
      state.tab = tab;
      state.enter = true;
      state.readerChapterId = null;
      window.scrollTo({ top: 0 });
      syncGameMusic();
      render();
    }

    function initAmbientParticles() {
      const canvas = document.getElementById("ambient-particles");
      if (!canvas) return;
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const ctx = canvas.getContext("2d");
      if (!ctx) return;

      const resize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      };
      resize();
      window.addEventListener("resize", resize, { passive: true });

      const count = window.innerWidth < 520 ? 18 : 28;
      const motes = Array.from({ length: count }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: 1 + Math.random() * 2.1,
        vy: -0.18 - Math.random() * 0.35,
        vx: (Math.random() - 0.5) * 0.22,
        a: 0.25 + Math.random() * 0.55,
        phase: Math.random() * Math.PI * 2
      }));

      const tickParticles = (t) => {
        if (document.hidden) {
          requestAnimationFrame(tickParticles);
          return;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < motes.length; i++) {
          const m = motes[i];
          m.x += m.vx + Math.sin(t * 0.001 + m.phase) * 0.14;
          m.y += m.vy;
          if (m.y < -12) {
            m.y = canvas.height + 12;
            m.x = Math.random() * canvas.width;
          }
          if (m.x < -12) m.x = canvas.width + 12;
          if (m.x > canvas.width + 12) m.x = -12;

          ctx.globalAlpha = m.a * (0.65 + 0.35 * Math.sin(t * 0.002 + m.phase));
          ctx.fillStyle = i % 3 === 0 ? "#FFF8DC" : "#F6CB77";
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(tickParticles);
      };
      requestAnimationFrame(tickParticles);
    }

    if (window.matchMedia && window.matchMedia("(pointer: fine)").matches && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      window.addEventListener("pointermove", (e) => {
        const nx = (e.clientX / window.innerWidth - 0.5) * 18;
        const ny = (e.clientY / window.innerHeight - 0.5) * 14;
        document.documentElement.style.setProperty("--px", `${nx.toFixed(1)}px`);
        document.documentElement.style.setProperty("--py", `${ny.toFixed(1)}px`);
      }, { passive: true });
    }

    function render() {
      applyThemeAndFont();
      syncGameMusic();
      syncAmbientSound();
      const root = document.getElementById("app");
      root.className = state.enter ? "enter" : "";
      state.enter = false;
      if (state.readerChapterId) {
        root.innerHTML = renderReader();
      } else {
        let body = "";
        if (state.tab === "beranda") body = renderBerandaTab();
        else if (state.tab === "tokoh") body = renderTokohTab();
        else if (state.tab === "kronologi") body = renderKronologiTab();
        else body = renderGameTab();

        root.innerHTML = body + `
          <nav class="bottom-nav" aria-label="Navigasi Utama">
            <button type="button" class="nav-btn ${(state.tab==='beranda' || state.tab==='tokoh')?'active':''}" onclick="switchTab('beranda')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4.5v-5.5h3V21H18a1 1 0 0 0 1-1V9.5"/></svg>
              <span>Beranda</span>
            </button>
            <button type="button" class="nav-btn ${state.tab==='kronologi'?'active':''}" onclick="switchTab('kronologi')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>
              <span>Kronologi</span>
            </button>
            <button type="button" class="nav-btn ${state.tab==='game'?'active':''}" onclick="switchTab('game')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
              <span>Tantangan</span>
            </button>
          </nav>
        `;

        if (state.tab === "beranda") {
          initOrbitalStage();
        } else if (state.tab === "game" && state.activeGame === "hub") {
          initSemiCarousel();
        } else if (state.tab === "kronologi") {
          initKronoFanStage();
        }
      }
      renderGameCardModal(false);
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        root.querySelectorAll("svg").forEach(s => { if (s.pauseAnimations) s.pauseAnimations(); });
      }
    }

    initAmbientParticles();
    render();
  </script>
</body>
</html>
