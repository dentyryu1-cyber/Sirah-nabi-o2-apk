<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sirah Nabi — Kelahiran &amp; Masa Kecil Nabi Muhammad SAW</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070D24;
      --bg-deep: #05091B;
      --surface: #0F183D;
      --surface-glass: rgba(14, 23, 58, 0.78);
      --surface-var: #172352;
      --text: #F2F4FC;
      --text-muted: #B0BADF;
      --primary: #F2C36B;
      --on-primary: #1B1202;
      --primary-container: rgba(242, 195, 107, 0.18);
      --on-primary-container: #FFE8B5;
      --secondary: #4FD1B5;
      --secondary-container: rgba(79, 209, 181, 0.16);
      --on-secondary-container: #B9F6E8;
      --tertiary: #F29B7B;
      --tertiary-container: rgba(242, 155, 123, 0.18);
      --outline: rgba(242, 195, 107, 0.30);
      --shadow: 0 12px 32px rgba(3, 6, 20, 0.52);
      --font-scale: 1;
      --font-display: 'Cormorant Garamond', 'Georgia', 'Times New Roman', serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --px: 0px;
      --py: 0px;
    }

    .reader-mode-shell[data-theme="light"] {
      --bg: #FBF8F1;
      --surface: #FFFDF9;
      --surface-var: #EFE8D8;
      --text: #1C1B17;
      --text-muted: #534C3E;
      --primary: #115E49;
      --on-primary: #FFFFFF;
      --primary-container: #CDEEE1;
      --on-primary-container: #063327;
      --secondary: #9C6916;
      --secondary-container: #FCE9C4;
      --on-secondary-container: #3E2600;
      --tertiary: #8C492B;
      --tertiary-container: #FFDBD0;
      --outline: #CFC4B0;
      --shadow: 0 4px 16px rgba(28, 27, 23, 0.08);
    }

    .reader-mode-shell[data-theme="sepia"] {
      --bg: #F3E7CF;
      --surface: #FAF0DC;
      --surface-var: #E9DABF;
      --text: #362819;
      --text-muted: #63503C;
      --primary: #115E49;
      --on-primary: #FFFFFF;
      --primary-container: #CDEEE1;
      --on-primary-container: #063327;
      --secondary: #9C6916;
      --secondary-container: #FCE9C4;
      --on-secondary-container: #3E2600;
      --tertiary: #8C492B;
      --tertiary-container: #FFDBD0;
      --outline: #D6C2A1;
      --shadow: 0 4px 16px rgba(54, 40, 25, 0.1);
    }

    .reader-mode-shell[data-theme="dark"] {
      --bg: #081029;
      --surface: #111B40;
      --surface-var: #1A2756;
      --text: #EEF1FA;
      --text-muted: #B6C0E4;
      --primary: #F2C36B;
      --on-primary: #1B1202;
      --primary-container: rgba(242, 195, 107, 0.2);
      --on-primary-container: #FFE8B5;
      --secondary: #5CE0C4;
      --secondary-container: rgba(92, 224, 196, 0.18);
      --on-secondary-container: #C6FAEE;
      --tertiary: #F2A88B;
      --tertiary-container: rgba(242, 168, 139, 0.2);
      --outline: rgba(242, 195, 107, 0.34);
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    .reader-mode-shell {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 40px;
      transition: background 0.22s ease, color 0.22s ease;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: radial-gradient(ellipse at 50% 24%, #1A1B4B 0%, #0D1538 48%, #05091B 100%);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.6;
      padding-bottom: 96px;
      overflow-x: hidden;
    }

    #app {
      position: relative;
      z-index: 2;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    h1, h2, h3, .serif {
      font-family: var(--font-display);
      margin: 0;
      line-height: 1.25;
    }

    p { margin: 0; }

    .card {
      background: var(--surface);
      border: 1px solid color-mix(in srgb, var(--outline) 55%, transparent);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      background: var(--secondary-container);
      color: var(--on-secondary-container);
    }

    .pill.primary {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    .pill.tertiary {
      background: var(--tertiary-container);
      color: var(--text);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 10px 16px;
      border-radius: 14px;
      border: none;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: var(--on-primary); width: 100%; }
    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      width: 100%;
    }
    .btn-icon {
      min-width: 44px;
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid color-mix(in srgb, var(--outline) 60%, transparent);
      background: var(--surface);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }

    .hero-art {
      position: relative;
      height: 190px;
      background: #0F4B3B;
      overflow: hidden;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.08), rgba(0,0,0,0.74));
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 18px;
      color: #fff;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: var(--surface-var);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .search-box {
      width: 100%;
      min-height: 46px;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid var(--outline);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font-body);
      outline: none;
    }
    .search-box:focus { border-color: var(--primary); }

    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
      scrollbar-width: none;
    }
    .chips-row::-webkit-scrollbar { display: none; }

    .chip {
      flex: 0 0 auto;
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--outline);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip.active {
      background: var(--primary-container);
      color: var(--on-primary-container);
      border-color: var(--primary);
    }

    .chapter-item {
      display: flex;
      gap: 14px;
      padding: 14px;
      cursor: pointer;
    }

    .chapter-thumb {
      width: 86px;
      height: 104px;
      border-radius: 14px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .chapter-num {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--primary);
      color: var(--on-primary);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stack { display: flex; flex-direction: column; gap: 14px; }
    .row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

    /* Floating Glass Capsule Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: max(12px, env(safe-area-inset-bottom, 12px));
      left: 50%;
      transform: translateX(-50%);
      width: min(390px, calc(100vw - 28px));
      background: rgba(11, 18, 46, 0.84);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(242, 195, 107, 0.28);
      border-radius: 999px;
      box-shadow: 0 16px 38px rgba(3, 6, 20, 0.65), inset 0 1px 0 rgba(255, 248, 224, 0.12);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 5px 10px;
      z-index: 60;
    }

    .nav-btn {
      position: relative;
      flex: 1;
      min-height: 50px;
      border: none;
      background: transparent;
      color: #9AA6D2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 999px;
      padding: 6px 4px;
      transition: color 0.22s ease, transform 0.2s ease, text-shadow 0.22s ease;
    }
    .nav-btn svg {
      width: 20px;
      height: 20px;
      transition: transform 0.22s ease, filter 0.22s ease;
    }
    .nav-btn.active {
      color: #F6CB77;
      text-shadow: 0 0 14px rgba(246, 203, 119, 0.55);
    }
    .nav-btn.active svg {
      transform: translateY(-1px) scale(1.08);
      filter: drop-shadow(0 0 8px rgba(246, 203, 119, 0.65));
    }
    .nav-btn.active::after {
      content: "";
      position: absolute;
      bottom: 2px;
      left: 24%;
      right: 24%;
      height: 2.5px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #F6CB77, transparent);
      box-shadow: 0 0 10px rgba(246, 203, 119, 0.9);
    }

    /* Reader View */
    .reader-topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid color-mix(in srgb, var(--outline) 45%, transparent);
      padding: 10px 14px;
    }

    .reader-body p {
      font-size: calc(16px * var(--font-scale));
      line-height: 1.75;
      white-space: pre-line;
    }

    .reader-body h3 {
      font-size: calc(21px * var(--font-scale));
      color: var(--primary);
      margin-bottom: 6px;
    }

    .hikmah-box {
      background: color-mix(in srgb, var(--primary-container) 55%, transparent);
      border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent);
      border-radius: 18px;
      padding: 16px;
    }

    .hikmah-list {
      list-style: none;
      padding: 0;
      margin: 10px 0 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hikmah-list li {
      position: relative;
      padding-left: 16px;
      font-size: calc(14.5px * var(--font-scale));
    }
    .hikmah-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 9px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }

    .modal-sheet {
      width: 100%;
      max-width: 640px;
      max-height: 85vh;
      overflow-y: auto;
      background: var(--surface);
      color: var(--text);
      border-radius: 24px 24px 0 0;
      padding: 20px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.25);
    }

    .avatar-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--primary-container);
      color: var(--on-primary-container);
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .quiz-opt {
      width: 100%;
      text-align: left;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1.5px solid color-mix(in srgb, var(--outline) 65%, transparent);
      background: color-mix(in srgb, var(--surface-var) 55%, transparent);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .quiz-opt.selected { border-color: var(--secondary); background: var(--secondary-container); color: var(--on-secondary-container); }
    .quiz-opt.correct { border-color: var(--primary); background: var(--primary-container); color: var(--on-primary-container); }
    .quiz-opt.wrong { border-color: var(--tertiary); background: var(--tertiary-container); }

    .opt-letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface);
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .map-svg {
      width: 100%;
      height: 220px;
      border-radius: 16px;
      display: block;
    }

    /* ===== Animasi tombol & interaksi ===== */
    .btn, .btn-icon, .chip, .nav-btn, .quiz-opt {
      transition: transform 0.2s cubic-bezier(.2,.8,.2,1), box-shadow 0.25s ease, background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .btn { position: relative; overflow: hidden; }
    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,0.38) 50%, transparent 65%);
      transform: translateX(-130%);
    }
    .btn-outline::after {
      background: linear-gradient(110deg, transparent 35%, color-mix(in srgb, var(--primary) 22%, transparent) 50%, transparent 65%);
    }
    .btn:focus-visible, .btn-icon:focus-visible, .chip:focus-visible, .nav-btn:focus-visible, .quiz-opt:focus-visible {
      outline: 3px solid var(--secondary);
      outline-offset: 2px;
    }
    .chapter-item { transition: transform 0.25s cubic-bezier(.2,.8,.2,1), box-shadow 0.25s ease, border-color 0.25s ease; }
    .chapter-thumb svg { transition: transform 0.6s ease; }

    @media (hover: hover) and (pointer: fine) {
      .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 22px color-mix(in srgb, var(--primary) 30%, transparent); }
      .btn:hover::after { animation: shimmer 0.9s ease; }
      .btn-outline:hover { background: var(--primary-container); }
      .btn-icon:hover { transform: translateY(-2px) rotate(-8deg) scale(1.1); background: var(--primary-container); border-color: var(--primary); }
      .chip:hover { transform: translateY(-2px); border-color: var(--primary); color: var(--primary); }
      .nav-btn:hover { transform: translateY(-3px); color: var(--primary); }
      .nav-btn:hover .ico { animation: wiggle 0.55s ease; }
      .quiz-opt:not(:disabled):hover { transform: translateX(6px); border-color: var(--secondary); }
      .quiz-opt:not(:disabled):hover .opt-letter { background: var(--secondary); color: var(--on-primary); }
      .chapter-item:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(28, 27, 23, 0.14); border-color: var(--primary); }
      .chapter-item:hover .chapter-thumb svg { transform: scale(1.12); }
      .chapter-item:hover .avatar-circle { animation: pop 0.4s ease; }
    }
    .btn:active { transform: translateY(0) scale(0.97); }
    .btn-icon.speaking { border-color: var(--primary); animation: speakPulse 1.2s ease-out infinite; }
    .quiz-opt.correct { animation: pop 0.45s ease; }
    .quiz-opt.wrong { animation: shake 0.45s ease; }
    .trophy { animation: trophy 1.6s ease-in-out infinite; }
    .progress-fill {
      background-image: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      background-size: 200% 100%;
      animation: bar 2.4s linear infinite;
    }

    /* ===== Animasi masuk halaman ===== */
    #app.enter .container > *,
    #app.enter .reader-body > * { animation: rise 0.55s cubic-bezier(.2,.8,.2,1) both; }
    #app.enter .container > *:nth-child(2), #app.enter .reader-body > *:nth-child(2) { animation-delay: 0.06s; }
    #app.enter .container > *:nth-child(3), #app.enter .reader-body > *:nth-child(3) { animation-delay: 0.12s; }
    #app.enter .container > *:nth-child(4), #app.enter .reader-body > *:nth-child(4) { animation-delay: 0.18s; }
    #app.enter .container > *:nth-child(5), #app.enter .reader-body > *:nth-child(5) { animation-delay: 0.24s; }
    #app.enter .container > *:nth-child(6), #app.enter .reader-body > *:nth-child(6) { animation-delay: 0.3s; }
    #app.enter .container > *:nth-child(7), #app.enter .reader-body > *:nth-child(7) { animation-delay: 0.36s; }
    #app.enter .container > *:nth-child(8), #app.enter .reader-body > *:nth-child(8) { animation-delay: 0.42s; }
    #app.enter .container > *:nth-child(n+9), #app.enter .reader-body > *:nth-child(n+9) { animation-delay: 0.5s; }
    .reader-body > .card:first-child svg { animation: kb 20s ease-in-out infinite alternate; }

    /* ===== Animasi ilustrasi sesuai materi ===== */
    .a-box { transform-box: fill-box; transform-origin: center; }
    .a-rotate { animation: spin 60s linear infinite; }
    .a-glow-outer { animation: glowO 4.5s ease-in-out infinite; }
    .a-glow-inner { animation: glowI 4.5s ease-in-out infinite; }
    .a-halo { animation: halo 5s ease-in-out infinite; }
    .a-twinkle { animation: twinkle 3s ease-in-out infinite; }
    .a-bird { animation: birdFly 10s linear infinite; }
    .a-wing { animation: flap 0.32s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .a-elephant { animation: elephantWalk 12s ease-in-out infinite; }
    .a-bob { animation: bob 0.6s ease-in-out infinite alternate; }
    .a-sway { animation: sway 5s ease-in-out infinite alternate; transform-origin: 68px 158px; }
    .a-frond { animation: frond 3.2s ease-in-out infinite alternate; transform-origin: 64px 96px; }
    .a-sheep { animation: sheepWalk 26s linear infinite; }
    .a-cloud { animation: cloud 40s linear infinite alternate; }
    .a-camel { animation: camelWalk 20s linear infinite; }
    .a-flow { animation: flow 1.4s linear infinite; }
    .a-flicker { animation: flicker 1.6s ease-in-out infinite; }
    .a-ring { animation: ring 2s ease-out infinite; }

    @keyframes shimmer { to { transform: translateX(130%); } }
    @keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
    @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.14); } 100% { transform: scale(1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes speakPulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary) 45%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }
    @keyframes trophy { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
    @keyframes bar { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    @keyframes kb { from { transform: scale(1); } to { transform: scale(1.1); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes glowO { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.14); } }
    @keyframes glowI { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 0.95; transform: scale(1.08); } }
    @keyframes halo { 0%, 100% { opacity: 0.1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.2); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes birdFly { 0% { transform: translate(0, 0); opacity: 0; } 8% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translate(-280px, 52px); opacity: 0; } }
    @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(0.35); } }
    @keyframes elephantWalk { 0% { transform: translateX(-100px); opacity: 0; } 8% { opacity: 1; } 55%, 86% { transform: translateX(30px); opacity: 1; } 100% { transform: translateX(30px); opacity: 0; } }
    @keyframes bob { to { transform: translateY(-2px); } }
    @keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
    @keyframes frond { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    @keyframes sheepWalk { from { transform: translateX(-60px); } to { transform: translateX(380px); } }
    @keyframes cloud { from { transform: translateX(0); } to { transform: translateX(140px); } }
    @keyframes camelWalk { from { transform: translateX(-80px); } to { transform: translateX(380px); } }
    @keyframes flow { to { stroke-dashoffset: calc(var(--dash, 13) * -1); } }
    @keyframes flicker { 0%, 100% { opacity: 0.4; } 30% { opacity: 0.7; } 55% { opacity: 0.35; } 80% { opacity: 0.6; } }
    @keyframes ring { 0% { opacity: 0.5; transform: scale(0.6); } 100% { opacity: 0; transform: scale(1.6); } }

    /* ===== 3D Kelompok 3 & Interactive Upgrades ===== */
    .k3-3d-wrap { perspective: 800px; display: inline-block; }
    .k3-3d-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 10px;
      background: linear-gradient(145deg, #166D55, #0B3A2D);
      border: 1px solid rgba(251, 229, 162, 0.55);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 248, 214, 0.4);
      transform: rotateX(8deg) rotateY(-4deg);
      transform-style: preserve-3d;
    }
    .k3-3d-text {
      display: inline-block;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: #FFF4CC;
      text-shadow: 0 1px 0 #C88D2B, 0 2px 0 #9D6C17, 0 3px 0 #6E4909, 0 5px 10px rgba(0,0,0,0.45);
    }

    /* Pilihan Link YouTube & Cari Video */
    .yt-card {
      padding: 18px;
      border: 1.5px solid color-mix(in srgb, #DC2626 24%, var(--outline));
      background: linear-gradient(155deg, color-mix(in srgb, #DC2626 5%, var(--surface)), var(--surface));
    }
    .yt-link-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .yt-link-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 13px;
      border-radius: 14px;
      border: 1px solid color-mix(in srgb, var(--outline) 65%, transparent);
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      transition: transform 0.14s ease, border-color 0.14s ease, background-color 0.14s ease;
    }
    .yt-link-item:hover {
      transform: translateY(-1px);
      border-color: #DC2626;
      background: color-mix(in srgb, #DC2626 5%, var(--surface));
    }
    .yt-play-badge {
      width: 38px;
      height: 28px;
      border-radius: 8px;
      background: #DC2626;
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      flex-shrink: 0;
      box-shadow: 0 3px 8px rgba(220, 38, 38, 0.28);
    }
    .yt-search-panel {
      padding: 12px;
      border-radius: 14px;
      background: var(--surface-var);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .yt-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 10px 14px;
      border-radius: 12px;
      background: #DC2626;
      color: #FFFFFF;
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .yt-btn:hover { opacity: 0.94; transform: translateY(-1px); }

    /* Slide Kuis Interaktif di setiap Kisah */
    .slide-quiz-card {
      padding: 18px;
      border: 1.5px solid color-mix(in srgb, var(--primary) 32%, transparent);
    }
    .slide-dots {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .slide-dot {
      min-width: 30px;
      height: 30px;
      border-radius: 10px;
      border: 1px solid var(--outline);
      background: var(--surface-var);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .slide-dot.active { border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
    .slide-dot.done-ok { border-color: var(--primary); background: var(--primary-container); color: var(--on-primary-container); }
    .slide-dot.done-no { border-color: var(--tertiary); background: var(--tertiary-container); color: var(--text); }
    .slide-stage {
      animation: slideSwap 0.32s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes slideSwap {
      from { opacity: 0; transform: translateX(18px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Susun Kata */
    .word-slots {
      min-height: 54px;
      padding: 10px;
      border-radius: 14px;
      border: 1.5px dashed var(--outline);
      background: color-mix(in srgb, var(--surface-var) 55%, transparent);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .word-chip {
      min-height: 38px;
      padding: 7px 12px;
      border-radius: 11px;
      border: 1.5px solid color-mix(in srgb, var(--primary) 45%, transparent);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 0 color-mix(in srgb, var(--outline) 80%, transparent);
      transition: transform 0.14s ease, opacity 0.14s ease, background-color 0.14s ease;
    }
    .word-chip:active { transform: translateY(2px); box-shadow: none; }
    .word-chip.picked {
      background: var(--primary-container);
      color: var(--on-primary-container);
      border-color: var(--primary);
    }
    .word-chip.used { opacity: 0.3; pointer-events: none; box-shadow: none; }

    /* Game Kartu & Dadu 3D */
    .game-hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .hud-box {
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid color-mix(in srgb, var(--outline) 60%, transparent);
      text-align: center;
    }
    .hud-val {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }
    .hud-lbl {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 2px;
    }

    .board-3d-wrap {
      perspective: 960px;
      padding: 4px 2px 10px;
    }
    .board-3d-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 12px;
      border-radius: 22px;
      background: linear-gradient(155deg, #115E49 0%, #09382B 100%);
      border: 2px solid #D9A13B;
      transform: rotateX(10deg);
      transform-style: preserve-3d;
      box-shadow: 0 18px 34px rgba(10, 35, 28, 0.28), inset 0 1px 0 rgba(255, 245, 200, 0.28);
    }
    .board-tile {
      position: relative;
      min-height: 70px;
      padding: 6px 5px;
      border-radius: 13px;
      background: #FFFDF8;
      color: #1C1B17;
      border: 1.5px solid #DFD2BA;
      box-shadow: 0 4px 0 #C7B698;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 2px;
      transform: translateZ(4px);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .board-tile.passed {
      background: #D8F3E8;
      border-color: #115E49;
      box-shadow: 0 4px 0 #0D4B3A;
    }
    .board-tile.goal {
      background: linear-gradient(145deg, #FCE7B2, #F4C86A);
      border-color: #9C6916;
      box-shadow: 0 4px 0 #8C5A0C;
    }
    .board-tile.active {
      border-color: #D98A16;
      box-shadow: 0 5px 0 #9C6916, 0 0 0 3px rgba(251, 229, 162, 0.85);
      transform: translateZ(12px) translateY(-2px);
      z-index: 3;
    }
    .tile-num {
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 9.5px;
      font-weight: 800;
      opacity: 0.7;
      font-variant-numeric: tabular-nums;
    }
    .tile-ico { font-size: 18px; line-height: 1.1; margin-top: 4px; }
    .tile-lbl { font-size: 9.5px; font-weight: 700; line-height: 1.15; }
    .tile-kind { font-size: 8.5px; font-weight: 700; color: #7C520C; opacity: 0.9; }
    .pawn-3d {
      position: absolute;
      top: -10px;
      right: -4px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #FFF2B8, #D98A16 68%, #8F5404);
      border: 2px solid #FFFDF9;
      box-shadow: 0 3px 0 #704104, 0 7px 12px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      z-index: 6;
      animation: pawnHop 0.34s cubic-bezier(.2,1.4,.4,1);
    }
    @keyframes pawnHop {
      0% { transform: translateY(0) scale(0.9); }
      50% { transform: translateY(-14px) scale(1.18); }
      100% { transform: translateY(0) scale(1); }
    }

    /* 3D Dice + Flying Animation */
    .dice-panel {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      overflow: visible !important;
    }
    .dice-scene {
      position: relative;
      width: 60px;
      height: 60px;
      perspective: 460px;
      flex-shrink: 0;
      overflow: visible;
      z-index: 30;
    }
    .dice-shadow {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: -8px;
      height: 10px;
      border-radius: 50%;
      background: rgba(14, 38, 30, 0.36);
      filter: blur(3px);
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .dice-shadow.flying {
      animation: diceShadowFly 1.24s cubic-bezier(.25, .8, .3, 1) both;
    }
    .dice-flight {
      position: relative;
      z-index: 32;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }
    .dice-flight.flying {
      animation: diceFly 1.24s cubic-bezier(.25, .8, .3, 1) both;
    }
    @keyframes diceFly {
      0%   { transform: translate3d(0px, 0px, 0) scale(1) rotateZ(0deg); }
      22%  { transform: translate3d(18px, -84px, 0) scale(1.42) rotateZ(105deg); }
      46%  { transform: translate3d(96px, 4px, 0) scale(1.03) rotateZ(260deg); }
      64%  { transform: translate3d(136px, -22px, 0) scale(1.1) rotateZ(410deg); }
      80%  { transform: translate3d(62px, 3px, 0) scale(0.98) rotateZ(580deg); }
      92%  { transform: translate3d(12px, -4px, 0) scale(1.01) rotateZ(685deg); }
      100% { transform: translate3d(0px, 0px, 0) scale(1) rotateZ(720deg); }
    }
    @keyframes diceShadowFly {
      0%   { transform: translateX(0px) scale(1); opacity: 0.65; }
      22%  { transform: translateX(18px) scale(0.42); opacity: 0.22; }
      46%  { transform: translateX(96px) scale(1.06); opacity: 0.72; }
      64%  { transform: translateX(136px) scale(0.75); opacity: 0.48; }
      80%  { transform: translateX(62px) scale(1.05); opacity: 0.7; }
      100% { transform: translateX(0px) scale(1); opacity: 0.65; }
    }
    .dice-cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1.22s cubic-bezier(.16, 1.04, .28, 1);
    }
    .dice-face {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: linear-gradient(145deg, #FFFDF8, #EFE2C6);
      border: 2px solid #C89436;
      box-shadow: inset 0 0 8px rgba(156, 105, 22, 0.2);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 8px;
      gap: 3px;
      place-items: center;
      backface-visibility: hidden;
    }
    .dice-f1 { transform: rotateY(0deg) translateZ(30px); }
    .dice-f2 { transform: rotateY(90deg) translateZ(30px); }
    .dice-f3 { transform: rotateX(90deg) translateZ(30px); }
    .dice-f4 { transform: rotateX(-90deg) translateZ(30px); }
    .dice-f5 { transform: rotateY(-90deg) translateZ(30px); }
    .dice-f6 { transform: rotateY(180deg) translateZ(30px); }
    .pip {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #115E49;
      box-shadow: inset 0 1px 1px rgba(0,0,0,0.35);
    }
    .pip.gold { background: #9C6916; width: 11px; height: 11px; }

    /* Multi-Player Pawns & Scoreboard */
    .pawns-stack {
      position: absolute;
      top: -9px;
      right: -3px;
      display: flex;
      gap: 2px;
      z-index: 6;
    }
    .pawn-mini {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #FFFDF9;
      color: #FFFFFF;
      font-size: 9px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 0 rgba(0,0,0,0.35), 0 4px 8px rgba(0,0,0,0.35);
    }
    .pawn-mini.hopping {
      animation: pawnHop 0.32s cubic-bezier(.2,1.4,.4,1);
    }
    .players-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
    }
    .player-pill-card {
      padding: 9px 10px;
      border-radius: 14px;
      background: var(--surface);
      border: 1.5px solid color-mix(in srgb, var(--outline) 60%, transparent);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .player-pill-card.turn-now {
      border-color: var(--primary);
      background: color-mix(in srgb, var(--primary-container) 45%, var(--surface));
      transform: translateY(-2px);
    }
    .player-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .mode-btn {
      padding: 12px;
      border-radius: 14px;
      border: 1.5px solid var(--outline);
      background: var(--surface);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }
    .mode-btn.selected {
      border-color: var(--primary);
      background: color-mix(in srgb, var(--primary-container) 55%, var(--surface));
    }

    /* Emerging 3D Card Modal (Single Rotation + Shake + Fireworks) */
    .game-card-overlay {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(6, 26, 20, 0.74);
      backdrop-filter: blur(5px);
      overflow-y: auto;
    }
    .game-card-overlay.open { display: flex; }
    .fireworks-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 126;
    }
    .game-card-3d {
      position: relative;
      z-index: 122;
      perspective: 1200px;
      width: 100%;
      max-width: 440px;
      margin: auto;
    }
    .game-card-3d.card-wrong-shake {
      animation: cardWrongShake 0.48s cubic-bezier(.36,.07,.19,.97) both;
    }
    .game-card-inner {
      position: relative;
      width: 100%;
      transform-style: preserve-3d;
    }
    .game-card-inner.flip-once {
      animation: cardEmergeFlip 0.92s cubic-bezier(.16, 1, .3, 1) both;
    }
    .game-card-front {
      position: relative;
      background: var(--surface);
      color: var(--text);
      border-radius: 22px;
      border: 2px solid #D9A13B;
      padding: 18px;
      box-shadow: 0 24px 50px rgba(0,0,0,0.45);
      backface-visibility: hidden;
    }
    .game-card-back {
      position: absolute;
      inset: 0;
      border-radius: 22px;
      border: 2px solid #FBE5A2;
      background: radial-gradient(circle at 50% 42%, #176E56 0%, #09382B 70%, #06211A 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #FFF4CC;
      transform: rotateY(180deg);
      backface-visibility: hidden;
      pointer-events: none;
    }
    @keyframes cardEmergeFlip {
      0% { opacity: 0; transform: translateY(110px) scale(0.28) rotateY(180deg); }
      48% { opacity: 1; transform: translateY(-10px) scale(1.03) rotateY(105deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotateY(0deg); }
    }
    @keyframes cardWrongShake {
      0%, 100% { transform: translateX(0) rotateZ(0); }
      15% { transform: translateX(-12px) rotateZ(-2deg); }
      30% { transform: translateX(12px) rotateZ(2deg); }
      45% { transform: translateX(-9px) rotateZ(-1.4deg); }
      60% { transform: translateX(9px) rotateZ(1.4deg); }
      75% { transform: translateX(-5px) rotateZ(-0.6deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
    }

    /* Side-Mounted Semi-Circular Game Carousel (Right Edge) */
    .semi-hub-shell {
      width: 100%;
      padding-bottom: 18px;
      overflow-x: clip;
    }
    .semi-top-bar {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 16px 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .semi-stage {
      position: relative;
      width: 100%;
      min-height: clamp(410px, 65dvh, 540px);
      display: flex;
      align-items: stretch;
      overflow: hidden;
      outline: none;
    }
    .semi-stage::before {
      content: "";
      position: absolute;
      right: -8%;
      top: 50%;
      width: min(520px, 76vw);
      height: min(520px, 76vw);
      transform: translateY(-50%);
      background: radial-gradient(circle, rgba(246, 203, 119, 0.14) 0%, rgba(92, 82, 224, 0.12) 45%, transparent 72%);
      pointer-events: none;
      z-index: 0;
    }
    .semi-info-pane {
      position: relative;
      z-index: 6;
      width: 45%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      padding: 20px 8px 20px max(16px, calc((100vw - 1120px) / 2 + 16px));
    }
    .semi-kicker {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #F6CB77;
    }
    .semi-title {
      font-family: var(--font-display);
      font-size: clamp(20px, 4.5vw, 34px);
      line-height: 1.14;
      color: #FFF6DC;
      text-wrap: balance;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.45);
    }
    .semi-desc {
      font-size: clamp(12px, 2.2vw, 15px);
      line-height: 1.55;
      color: #C7D1F0;
      max-width: 42ch;
    }
    .semi-cta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .semi-play-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 20px;
      border-radius: 14px;
      border: 1.5px solid #FFE8A6;
      background: linear-gradient(135deg, #F8D37E 0%, #D4922B 100%);
      color: #1A1102;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 8px 22px rgba(242, 195, 107, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.55);
      transition: transform 0.16s ease, box-shadow 0.2s ease;
    }
    .semi-play-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(242, 195, 107, 0.48);
    }
    .semi-hint {
      font-size: 11px;
      color: #93A1CF;
    }
    .semi-wheel-pane {
      position: relative;
      flex: 1;
      height: clamp(410px, 65dvh, 540px);
      z-index: 4;
      touch-action: none;
      user-select: none;
      cursor: grab;
      perspective: 1100px;
    }
    .semi-wheel-pane.dragging {
      cursor: grabbing;
    }
    .semi-arc-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .semi-nav-btn {
      position: absolute;
      left: 0;
      top: 0;
      width: 44px;
      height: 44px;
      margin-left: -22px;
      margin-top: -22px;
      border-radius: 50%;
      border: 1.5px solid rgba(246, 203, 119, 0.72);
      background: radial-gradient(circle at 32% 28%, rgba(36, 48, 104, 0.96), rgba(10, 16, 44, 0.94));
      color: #FFE4A0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 25;
      box-shadow: 0 0 18px rgba(246, 203, 119, 0.32), 0 6px 14px rgba(0, 0, 0, 0.5);
      transition: transform 0.16s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .semi-nav-btn:hover {
      transform: scale(1.1);
      border-color: #FFF0BE;
      box-shadow: 0 0 24px rgba(246, 203, 119, 0.56);
    }
    .semi-nav-btn:active {
      transform: scale(0.95);
    }
    .semi-card {
      position: absolute;
      left: 0;
      top: 0;
      width: 266px;
      height: 70px;
      border-radius: 18px;
      padding: 8px 14px 8px 9px;
      border: 1.5px solid rgba(246, 203, 119, 0.34);
      background: linear-gradient(135deg, rgba(25, 36, 86, 0.9) 0%, rgba(11, 17, 46, 0.88) 100%);
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 26px rgba(3, 6, 20, 0.62), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      gap: 11px;
      text-align: left;
      cursor: pointer;
      color: #EEF2FF;
      transform-origin: left center;
      will-change: transform, opacity;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .semi-card.is-focused {
      border: 2px solid #FFF0B8;
      background: linear-gradient(135deg, #FFF3D1 0%, #F7CE78 62%, #DF9E34 100%);
      color: #1A1103;
      box-shadow:
        0 0 30px rgba(246, 203, 119, 0.58),
        0 16px 34px rgba(3, 6, 20, 0.72),
        inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }
    .semi-card-thumb {
      width: 50px;
      height: 50px;
      border-radius: 13px;
      background: radial-gradient(circle at 30% 25%, #233170, #0C1334);
      border: 1.5px solid rgba(246, 203, 119, 0.52);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.2), 0 4px 10px rgba(0, 0, 0, 0.4);
    }
    .semi-card.is-focused .semi-card-thumb {
      border-color: rgba(124, 77, 11, 0.45);
      box-shadow: 0 4px 12px rgba(96, 59, 6, 0.28);
    }
    .semi-card-text {
      min-width: 0;
      flex: 1;
    }
    .semi-card-title {
      font-family: var(--font-display);
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.18;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .semi-card-sub {
      font-size: 10.5px;
      font-weight: 600;
      opacity: 0.78;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .semi-lower-meta {
      max-width: 1060px;
      margin: 4px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    @media (max-width: 639px) {
      .semi-stage {
        min-height: 410px;
      }
      .semi-wheel-pane {
        height: 410px;
      }
      .semi-info-pane {
        width: 44%;
        padding: 14px 4px 14px 14px;
        gap: 7px;
      }
      .semi-kicker {
        font-size: 10px;
      }
      .semi-desc {
        font-size: 11.5px;
        line-height: 1.42;
      }
      .semi-play-cta {
        min-height: 38px;
        padding: 8px 13px;
        font-size: 12px;
        border-radius: 12px;
      }
      .semi-card {
        width: 168px;
        height: 54px;
        border-radius: 14px;
        padding: 5px 10px 5px 6px;
        gap: 8px;
      }
      .semi-card-thumb {
        width: 38px;
        height: 38px;
        border-radius: 10px;
      }
      .semi-card-thumb svg {
        width: 22px;
        height: 22px;
      }
      .semi-card-title {
        font-size: 11.5px;
      }
      .semi-card-sub {
        display: none;
      }
      .semi-nav-btn {
        width: 38px;
        height: 38px;
        margin-left: -19px;
        margin-top: -19px;
      }
    }
    .game-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Memori Pasangan 3D */
    .mem-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      perspective: 1000px;
    }
    @media (max-width: 500px) {
      .mem-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    }
    .mem-card {
      position: relative;
      height: 108px;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      perspective: 900px;
      font-family: var(--font-body);
    }
    .mem-card.is-shaking {
      animation: cardWrongShake 0.45s cubic-bezier(.36,.07,.19,.97) both;
    }
    .mem-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.54s cubic-bezier(.16, 1, .3, 1);
    }
    .mem-card.is-open .mem-card-inner {
      transform: rotateY(180deg);
    }
    .mem-face {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      text-align: center;
    }
    .mem-back {
      background: radial-gradient(circle at 50% 40%, #176E56, #09382B);
      border: 2px solid #D9A13B;
      color: #FFF4CC;
      box-shadow: 0 4px 0 #07281F;
    }
    .mem-front {
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--primary);
      transform: rotateY(180deg);
      box-shadow: 0 4px 0 color-mix(in srgb, var(--primary) 45%, transparent);
    }
    .mem-card.is-matched .mem-front {
      background: color-mix(in srgb, var(--primary-container) 70%, var(--surface));
      border-color: #D9A13B;
      box-shadow: 0 3px 0 #B38122;
    }
    .mem-kind-tag {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--secondary-container);
      color: var(--on-secondary-container);
      margin-bottom: 4px;
    }

    /* Susun Jejak Kronologi */
    .chrono-slots {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chrono-slot {
      min-height: 48px;
      padding: 8px 12px;
      border-radius: 13px;
      border: 1.5px dashed var(--outline);
      background: color-mix(in srgb, var(--surface-var) 55%, transparent);
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      color: var(--text);
      font-family: var(--font-body);
      cursor: pointer;
      width: 100%;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }
    .chrono-slot.filled {
      border-style: solid;
      border-color: var(--primary);
      background: var(--surface);
    }
    .chrono-slot.ok {
      border-color: var(--primary);
      background: var(--primary-container);
      color: var(--on-primary-container);
    }
    .chrono-slot.bad {
      border-color: var(--tertiary);
      background: var(--tertiary-container);
      animation: cardWrongShake 0.45s cubic-bezier(.36,.07,.19,.97) both;
    }
    .chrono-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--primary);
      color: var(--on-primary);
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .chrono-bank {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chrono-chip {
      width: 100%;
      min-height: 44px;
      padding: 9px 12px;
      border-radius: 12px;
      border: 1.5px solid color-mix(in srgb, var(--primary) 42%, transparent);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 3px 0 color-mix(in srgb, var(--outline) 75%, transparent);
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .chrono-chip:active { transform: translateY(2px); box-shadow: none; }
    .chrono-chip.used { opacity: 0.32; pointer-events: none; box-shadow: none; }

    /* Tebak Kilat Sirah */
    .blitz-timer-track {
      width: 100%;
      height: 9px;
      border-radius: 999px;
      background: var(--surface-var);
      overflow: hidden;
    }
    .blitz-timer-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #115E49, #D9A13B);
      transition: width 0.2s linear;
    }
    .blitz-timer-fill.low {
      background: linear-gradient(90deg, #B91C1C, #EA580C);
    }
    .blitz-card-shake {
      animation: cardWrongShake 0.45s cubic-bezier(.36,.07,.19,.97) both;
    }

    /* Special Board Tiles & Legend */
    .board-tile.tile-bonus {
      background: linear-gradient(150deg, #FFF8E1, #FDE7AC);
      border-color: #D9A13B;
      box-shadow: 0 4px 0 #B37E20;
    }
    .board-tile.tile-advance {
      background: linear-gradient(150deg, #E4F8F0, #BDECD8);
      border-color: #115E49;
      box-shadow: 0 4px 0 #0A3E30;
    }
    .board-tile.tile-double {
      background: linear-gradient(150deg, #FFF2D6, #F7CE78);
      border-color: #B45309;
      box-shadow: 0 4px 0 #853B04;
    }
    .board-tile.passed.tile-bonus,
    .board-tile.passed.tile-advance,
    .board-tile.passed.tile-double {
      filter: saturate(1.06);
    }
    .tile-tag {
      position: absolute;
      top: 3px;
      right: 4px;
      font-size: 8px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 5px;
      background: #115E49;
      color: #FFFDF9;
      letter-spacing: 0.2px;
    }
    .board-tile.tile-bonus .tile-tag { background: #B45309; }
    .board-tile.tile-double .tile-tag { background: #991B1B; }
    .tile-notice-banner {
      padding: 10px 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, #FFF7DB, #FCE7B2);
      border: 1.5px solid #D9A13B;
      color: #5C3A06;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: cardPopIn 0.3s ease both;
    }
    @keyframes cardPopIn {
      from { opacity: 0; transform: translateY(-6px) scale(0.97); }
      to { opacity: 1; transform: none; }
    }
    .board-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .board-legend span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 8px;
      background: var(--surface-var);
      font-weight: 600;
    }

    /* Classroom Presentation / Fullscreen Mode */
    body.present-mode .container {
      max-width: 980px;
    }
    body.present-mode .board-tile {
      min-height: 86px;
      padding: 8px;
    }
    body.present-mode .tile-ico { font-size: 22px; }
    body.present-mode .tile-lbl { font-size: 11px; }
    body.present-mode .buzzer-btn { min-height: 92px; font-size: 16px; }

    /* Audio Controls Strip */
    .audio-controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--surface-var);
      margin-top: 10px;
    }
    .vol-range {
      accent-color: var(--primary);
      width: 105px;
      cursor: pointer;
    }

    /* Badges & Hall of Fame */
    .badges-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
    }
    .badge-item {
      padding: 10px 12px;
      border-radius: 14px;
      border: 1.5px solid color-mix(in srgb, var(--outline) 65%, transparent);
      background: var(--surface);
      display: flex;
      align-items: flex-start;
      gap: 9px;
      opacity: 0.56;
      filter: grayscale(0.75);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .badge-item.unlocked {
      opacity: 1;
      filter: none;
      border-color: #D9A13B;
      background: color-mix(in srgb, #FCE9C4 35%, var(--surface));
    }
    .hof-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hof-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 12px;
      background: var(--surface-var);
      font-size: 12.5px;
    }

    /* Game 5: Buzzer Rebutan Kelompok */
    .buzzer-pad-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 10px;
    }
    .buzzer-btn {
      min-height: 76px;
      padding: 12px 10px;
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,0.65);
      color: #FFFFFF;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 5px 0 rgba(0,0,0,0.28);
      transition: transform 0.1s ease, opacity 0.2s ease, box-shadow 0.1s ease;
    }
    .buzzer-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.28);
    }
    .buzzer-btn:disabled {
      opacity: 0.36;
      cursor: not-allowed;
      box-shadow: none;
    }
    .buzzer-key-hint {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(0,0,0,0.24);
    }

    /* Game 6: Makna Istilah Sirah */
    .term-showcase {
      padding: 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--primary-container) 55%, var(--surface)), color-mix(in srgb, var(--secondary-container) 45%, var(--surface)));
      border: 1.5px solid color-mix(in srgb, var(--primary) 40%, transparent);
      text-align: center;
    }
    /* ============================================================
       FLOATING 3D ORBITAL INTERFACE & COSMIC BACKDROP
       ============================================================ */
    .cosmic-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(ellipse 68% 48% at 50% 42%, rgba(74, 58, 138, 0.34) 0%, rgba(19, 30, 78, 0.22) 48%, transparent 78%),
        radial-gradient(circle at 50% 46%, rgba(242, 195, 107, 0.13) 0%, transparent 45%),
        linear-gradient(180deg, #05091D 0%, #0C153B 46%, #181744 82%, #0C1335 100%);
    }
    .cosmic-stars-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: translate3d(calc(var(--px) * 0.25), calc(var(--py) * 0.25), 0);
      transition: transform 0.2s ease-out;
    }
    #ambient-particles {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .cosmic-clouds {
      position: absolute;
      inset: 0;
      transform: translate3d(calc(var(--px) * 0.55), calc(var(--py) * 0.35), 0);
      transition: transform 0.22s ease-out;
    }
    .cosmic-lantern {
      position: absolute;
      top: -6px;
      transform-origin: top center;
      filter: drop-shadow(0 0 18px rgba(246, 195, 92, 0.55));
      animation: lanternSwing 6.5s ease-in-out infinite alternate;
    }
    .cosmic-lantern.left {
      left: clamp(8px, 6vw, 84px);
      width: clamp(54px, 8vw, 88px);
    }
    .cosmic-lantern.right {
      right: clamp(8px, 6vw, 84px);
      width: clamp(58px, 8.5vw, 94px);
      animation-delay: -2.8s;
      animation-duration: 7.4s;
    }
    @keyframes lanternSwing {
      0% { transform: rotate(-2.4deg) translate3d(calc(var(--px) * 0.4), 0, 0); }
      100% { transform: rotate(2.4deg) translate3d(calc(var(--px) * 0.4), 0, 0); }
    }
    .cosmic-horizon {
      position: absolute;
      left: -3%;
      right: -3%;
      bottom: 0;
      height: clamp(130px, 24vh, 220px);
      transform: translate3d(calc(var(--px) * 0.7), calc(var(--py) * 0.3), 0);
      transition: transform 0.25s ease-out;
    }

    /* Beranda Layout */
    .orbital-page {
      position: relative;
      min-height: calc(100dvh - 44px);
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 14px 98px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    /* Top HUD Bar */
    .orbital-hud {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 35;
    }
    .learner-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      max-width: calc(100% - 140px);
      min-height: 46px;
      padding: 5px 14px 5px 6px;
      border-radius: 999px;
      border: 1px solid rgba(182, 198, 248, 0.32);
      background: rgba(13, 21, 56, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #F2F4FC;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 8px 22px rgba(3, 6, 20, 0.35);
      transition: border-color 0.2s ease, transform 0.16s ease;
    }
    .learner-pill:hover {
      border-color: rgba(242, 195, 107, 0.65);
      transform: translateY(-1px);
    }
    .learner-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(145deg, #2D3F7E, #162252);
      border: 1.5px solid rgba(242, 195, 107, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FCE6A6;
      font-weight: 800;
      font-size: 13px;
      flex-shrink: 0;
    }
    .hud-circle-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(182, 198, 248, 0.3);
      background: rgba(13, 21, 56, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #F6CB77;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(3, 6, 20, 0.35);
      transition: transform 0.16s ease, border-color 0.2s ease, background-color 0.2s ease;
    }
    .hud-circle-btn:hover {
      border-color: #F2C36B;
      background: rgba(25, 39, 94, 0.85);
      transform: translateY(-1px);
    }
    .hud-circle-btn.is-active {
      border-color: rgba(242, 195, 107, 0.55);
      box-shadow: 0 6px 18px rgba(3, 6, 20, 0.35), 0 0 14px rgba(242, 195, 107, 0.18);
    }
    .hud-circle-btn.is-muted {
      color: #9BA7D0;
      opacity: 0.78;
    }

    /* Arched Title Crest */
    .sirah-arch-header {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 18px 28px 4px;
      margin-top: -6px;
      z-index: 26;
      max-width: 440px;
    }
    .sirah-arch-frame {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 152px;
      pointer-events: none;
      opacity: 0.92;
      filter: drop-shadow(0 0 12px rgba(242, 195, 107, 0.38));
    }
    .sirah-main-title {
      position: relative;
      font-family: var(--font-display);
      font-size: clamp(32px, 6.2vw, 48px);
      font-weight: 700;
      line-height: 0.96;
      letter-spacing: -0.01em;
      background: linear-gradient(180deg, #FFFDF7 0%, #FFE6A8 56%, #E5A93D 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 14px rgba(242, 195, 107, 0.32));
    }
    .sirah-sub-copy {
      position: relative;
      margin-top: 6px;
      font-size: clamp(11.5px, 2.5vw, 13.5px);
      color: #DCE3FA;
      max-width: 310px;
      line-height: 1.4;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .sirah-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 190px;
      margin-top: 8px;
    }
    .sirah-divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #F2C36B, transparent);
      opacity: 0.8;
    }

    /* 3D Elliptical Orbital Stage */
    .orbital-stage {
      position: relative;
      width: 100%;
      height: clamp(380px, 57vh, 500px);
      margin: 6px auto 0;
      perspective: 1200px;
      transform-style: preserve-3d;
      touch-action: pan-y;
      user-select: none;
      cursor: grab;
      z-index: 20;
    }
    .orbital-stage.dragging {
      cursor: grabbing;
    }

    .orbit-rings-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transform-style: preserve-3d;
    }
    .orbit-ellipse {
      position: absolute;
      width: min(780px, 96vw);
      height: clamp(190px, 26vw, 250px);
      border-radius: 50%;
      border: 1.5px solid rgba(255, 224, 150, 0.55);
      box-shadow:
        0 0 22px rgba(242, 195, 107, 0.35),
        inset 0 0 18px rgba(242, 195, 107, 0.16);
      transform: translateY(62px) rotateX(68deg) rotateZ(-4deg);
    }
    .orbit-ellipse.secondary {
      width: min(600px, 78vw);
      height: clamp(148px, 20vw, 195px);
      border: 1px dashed rgba(255, 232, 175, 0.34);
      box-shadow: 0 0 16px rgba(242, 195, 107, 0.22);
      transform: translateY(34px) rotateX(70deg) rotateZ(8deg);
    }

    /* Central Dominant Floating Island */
    .central-island {
      position: absolute;
      left: 50%;
      top: 32%;
      width: clamp(208px, 42vw, 305px);
      transform: translate(-50%, -50%);
      z-index: 20;
      pointer-events: none;
    }
    .island-float-wrap {
      position: relative;
      width: 100%;
      animation: islandBob 5.2s ease-in-out infinite;
    }
    @keyframes islandBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .island-aura {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 118%;
      height: 72%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 222, 145, 0.45) 0%, rgba(242, 195, 107, 0.18) 46%, transparent 74%);
      filter: blur(8px);
      z-index: -1;
    }

    /* Floating Orbital Sculpted Medallions (Non-Boxy Islamic Arch Silhouette) */
    .orbit-cards-layer {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      pointer-events: none;
    }
    .orbit-card {
      position: absolute;
      left: 50%;
      top: 62%;
      width: clamp(118px, 27vw, 166px);
      margin-left: calc(clamp(118px, 27vw, 166px) / -2);
      margin-top: calc(clamp(150px, 33vw, 200px) / -2);
      pointer-events: auto;
      cursor: pointer;
      will-change: transform, opacity;
      transform-style: preserve-3d;
      outline: none;
      background: transparent;
      border: none;
      padding: 0;
      text-align: center;
      overflow: visible;
    }
    .orbit-arch-crest {
      position: relative;
      display: block;
      width: 56px;
      height: 15px;
      margin: 0 auto -4px;
      z-index: 3;
      pointer-events: none;
      filter: drop-shadow(0 0 8px rgba(246, 203, 119, 0.65));
    }
    .orbit-card-shell {
      position: relative;
      display: flex;
      flex-direction: column;
      border-radius: 50% 50% 46% 46% / 48% 48% 28% 28%;
      padding: 4px;
      overflow: hidden;
      background: linear-gradient(160deg, #FFF0BE 0%, #DF9F3A 52%, #9B6B1E 100%);
      box-shadow: 0 18px 34px rgba(2, 5, 18, 0.68), 0 0 0 1px rgba(255, 240, 194, 0.42);
      transition: box-shadow 0.25s ease, filter 0.25s ease;
    }
    .orbit-card.is-front .orbit-card-shell {
      box-shadow:
        0 24px 44px rgba(2, 5, 18, 0.8),
        0 0 30px rgba(246, 203, 119, 0.62),
        0 0 0 1.5px rgba(255, 244, 212, 0.88);
    }
    .orbit-card-arch {
      position: relative;
      height: clamp(78px, 17vw, 104px);
      border-radius: 50% 50% 18% 18% / 76% 76% 18% 18%;
      overflow: hidden;
      background: #1B2758;
    }
    .orbit-card-plaque {
      position: relative;
      margin-top: -12px;
      padding: 10px 14px 14px;
      border-radius: 24px 24px 50% 50% / 16px 16px 36% 36%;
      background: linear-gradient(180deg, #FFFBF3 0%, #F3E2C4 100%);
      color: #1C1B17;
      border-top: 1.5px solid #E8C57B;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .orbit-card-title {
      font-family: var(--font-body);
      font-size: clamp(12px, 2.7vw, 14.5px);
      font-weight: 800;
      color: #161829;
      line-height: 1.15;
    }
    .orbit-card-bottom {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }
    .orbit-card-sub {
      font-size: clamp(9.5px, 2.15vw, 10.8px);
      line-height: 1.25;
      color: #4D4539;
      font-weight: 500;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-align: center;
    }
    .orbit-card-go {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #17214D;
      color: #FFFDF8;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      flex-shrink: 0;
      box-shadow: 0 3px 8px rgba(13, 21, 56, 0.35);
    }
    .orbit-card.is-front .orbit-card-go {
      background: linear-gradient(135deg, #1E2E6E, #0F173B);
      box-shadow: 0 0 10px rgba(242, 195, 107, 0.52);
    }

    /* Orbit Controls (Arrows, Dots & CTA) */
    .orbital-footer-controls {
      position: relative;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }
    .orbit-nav-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .orbit-arrow-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(242, 195, 107, 0.36);
      background: rgba(13, 21, 56, 0.72);
      color: #F6CB77;
      font-size: 16px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform 0.15s ease, border-color 0.2s ease, background-color 0.2s ease;
    }
    .orbit-arrow-btn:hover {
      border-color: #F6CB77;
      background: rgba(25, 39, 94, 0.9);
      transform: scale(1.06);
    }
    .orbit-dots {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .orbit-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: none;
      padding: 0;
      background: rgba(182, 198, 248, 0.35);
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }
    .orbit-dot.active {
      background: #F6CB77;
      transform: scale(1.38);
      box-shadow: 0 0 10px rgba(246, 203, 119, 0.85);
    }

    .cta-mulai-belajar {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 48px;
      padding: 8px 22px 8px 14px;
      border-radius: 999px;
      border: 2px solid #FFE8AF;
      background: linear-gradient(180deg, #FFE49E 0%, #F2BA4E 55%, #C88B22 100%);
      color: #2A1B03;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.2px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(242, 186, 78, 0.42), inset 0 1px 1px rgba(255, 255, 255, 0.6);
      transition: transform 0.16s ease, box-shadow 0.2s ease;
    }
    .cta-mulai-belajar:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(242, 186, 78, 0.56), inset 0 1px 1px rgba(255, 255, 255, 0.75);
    }
    .cta-mulai-belajar:active {
      transform: scale(0.97);
    }
    .cta-play-badge {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #4C3105;
      color: #FFE8AF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .orbit-status-hint {
      font-size: 11px;
      color: #C3CCEE;
      letter-spacing: 0.2px;
      text-align: center;
      opacity: 0.9;
    }

    /* Glassmorphism refinements for Materi, Kronologi, & Arena Permainan */
    .card {
      background: var(--surface-glass, var(--surface));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .reader-mode-shell .card {
      background: var(--surface);
      backdrop-filter: none;
    }
    .subtab-switch {
      display: flex;
      gap: 6px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(11, 18, 46, 0.75);
      border: 1px solid rgba(242, 195, 107, 0.25);
    }
    .subtab-btn {
      flex: 1;
      min-height: 38px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .subtab-btn.active {
      background: linear-gradient(135deg, #F2C36B, #CE902A);
      color: #1A1202;
    }
    .stat-mini-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat-mini-box {
      padding: 10px 8px;
      border-radius: 14px;
      background: rgba(23, 35, 82, 0.72);
      border: 1px solid rgba(242, 195, 107, 0.22);

    }
    .stat-mini-val {
      font-size: 18px;
      font-weight: 800;
      color: #F6CB77;
      font-variant-numeric: tabular-nums;
    }
    .stat-mini-lbl {
      font-size: 11px;
      color: #B9C3E8;
    }

    /* Interactive Kronologi Tour Controls */
    .kronologi-tour-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      border-radius: 16px;
      background: rgba(10, 17, 46, 0.72);
      border: 1px solid rgba(242, 195, 107, 0.28);
    }
    .kronologi-step-strip {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }
    .kronologi-step-btn {
      position: relative;
      height: 32px;
      border-radius: 10px;
      border: 1px solid rgba(242, 195, 107, 0.28);
      background: rgba(19, 30, 74, 0.85);
      color: #C7D1F5;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.16s ease, border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
    }
    .kronologi-step-btn.passed {
      background: rgba(242, 195, 107, 0.16);
      border-color: rgba(242, 195, 107, 0.55);
      color: #FCE6A6;
    }
    .kronologi-step-btn.active {
      background: linear-gradient(135deg, #F6CB77, #D4922B);
      border-color: #FFF0BE;
      color: #1A1204;
      box-shadow: 0 0 14px rgba(246, 203, 119, 0.52);
      transform: translateY(-1px);
    }
    .kronologi-tour-controls {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .kronologi-nav-btn {
      min-height: 38px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid rgba(242, 195, 107, 0.36);
      background: rgba(18, 29, 71, 0.88);
      color: #FCE6A6;
      font-family: var(--font-body);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;

    }
    .kronologi-nav-btn:disabled {
      opacity: 0.36;
      cursor: not-allowed;
    }
    .kronologi-nav-btn:not(:disabled):hover {
      border-color: #F6CB77;
      transform: translateY(-1px);
    }
    .kronologi-play-btn {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid #FFE8AF;
      background: linear-gradient(135deg, #F8D37E, #CC8A24);
      color: #1B1203;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 6px 18px rgba(212, 146, 43, 0.35);
      transition: transform 0.16s ease, box-shadow 0.2s ease;
    }
    .kronologi-play-btn.is-playing {
      background: linear-gradient(135deg, #1E6B53, #114737);

      color: #EFFFF8;
      box-shadow: 0 0 18px rgba(126, 227, 189, 0.38);
    }
    .kronologi-live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7EE3BD;
      box-shadow: 0 0 0 0 rgba(126, 227, 189, 0.7);

    .kronologi-voice-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;

    .kronologi-voice-btn {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid rgba(242, 195, 107, 0.34);
      background: rgba(24, 37, 89, 0.85);
      color: #F6E4B8;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;

      border-color: #F6CB77;
      background: rgba(242, 195, 107, 0.2);
      color: #FFF6DC;
      animation: speakPulse 1.2s ease-out infinite;

    /* Editorial Cascading Gold-Frame Kronologi Card Fan */
    .krono-shell {
      position: relative;
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 16px 26px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    /* Double vertical editorial gold hairlines along left margin */
    .krono-shell::before,
    .krono-shell::after {
      content: "";
      position: absolute;
      top: 8px;
      bottom: 14px;
      width: 1px;
      pointer-events: none;
    }
    .krono-shell::before {
      left: 10px;
      background: linear-gradient(180deg, transparent, rgba(235, 196, 118, 0.48) 12%, rgba(235, 196, 118, 0.48) 88%, transparent);
    }
    .krono-shell::after {
      left: 15px;
      background: linear-gradient(180deg, transparent, rgba(235, 196, 118, 0.2) 16%, rgba(235, 196, 118, 0.2) 84%, transparent);
    }
    .krono-top-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .krono-stats-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #BAC5E8;
      padding-top: 6px;
      font-variant-numeric: tabular-nums;
    }
    .krono-stats-line strong {
      color: #F6CB77;
      font-weight: 700;
    }
    .krono-title-block {
      margin-left: auto;
      text-align: right;
    }
    .krono-editorial-title {
      font-family: var(--font-display);
      font-size: clamp(26px, 4.8vw, 42px);
      font-weight: 700;
      line-height: 1.04;
      color: #ECC784;
      text-wrap: balance;
      text-shadow: 0 4px 20px rgba(236, 199, 132, 0.22);
    }
    .krono-editorial-sub {
      font-size: 12px;
      color: #9CA9D4;
      margin-top: 4px;
      letter-spacing: 0.02em;
    }
    .krono-fan-stage {
      position: relative;
      width: 100%;
      height: clamp(330px, 48vh, 430px);
      overflow: hidden;
      touch-action: pan-y;
      user-select: none;
      cursor: grab;
      outline: none;
    }
    .krono-fan-stage.dragging {
      cursor: grabbing;
    }
    .krono-fan-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 48%, rgba(240, 198, 120, 0.1) 0%, rgba(92, 82, 224, 0.08) 42%, transparent 72%);
      pointer-events: none;
      z-index: 0;
    }
    .krono-fan-card {
      position: absolute;
      left: 0;
      top: 0;
      width: 196px;
      height: 266px;
      border-radius: 15px;
      border: 2.2px solid rgba(236, 199, 132, 0.72);
      background: linear-gradient(155deg, rgba(17, 22, 48, 0.9) 0%, rgba(8, 11, 26, 0.88) 100%);
      box-shadow:
        0 18px 38px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 240, 200, 0.14);
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      color: #F7F3E8;

      transform-origin: center center;

      transition: border-color 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;

    .krono-fan-card.is-focused {

        inset 0 0 22px rgba(246, 203, 119, 0.12);

      transform: scale(1.06);

    .krono-card-scrim {

    .krono-card-click-cue {
      font-size: 11px;
      font-weight: 700;
      color: #F7D48C;
      opacity: 0;

      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.85);

    .krono-card-emblem {

    .krono-callout-cta {
      margin-top: 4px;

    function shuffleWords(arr) {

        [copy[k], copy[j]] = [copy[j], copy[k]];

    let musicFilterNode = null;
