name: Build Standalone Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build offline bundle for Android APK
        run: |
          VITE_BASE_PATH="./" VITE_CAPACITOR="true" CAPACITOR_BUILD="true" bun run build

      - name: Create Capacitor Android project
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Apply Sirah Nabi icons, dark theme, and WebView settings
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y imagemagick
          fi

          # Launcher icons (any + round + adaptive foreground)
          for pair in "mdpi:48:108" "hdpi:72:162" "xhdpi:96:216" "xxhdpi:144:324" "xxxhdpi:192:432"; do
            IFS=':' read -r density size fgsize <<< "$pair"
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert public/pwa-512x512.png -resize "${size}x${size}" "$dir/ic_launcher.png"
            convert public/pwa-512x512.png -resize "${size}x${size}" \
              \( -size "${size}x${size}" xc:none -fill white -draw "circle $((size/2)),$((size/2)) $((size/2)),1" \) \
              -compose DstIn -composite "$dir/ic_launcher_round.png"
            convert public/pwa-maskable-512x512.png -resize "${fgsize}x${fgsize}" "$dir/ic_launcher_foreground.png"
          done

          # Adaptive icon XML + cosmic navy background
          mkdir -p android/app/src/main/res/values android/app/src/main/res/mipmap-anydpi-v26
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <color name="ic_launcher_background">#070D24</color>' \
            '</resources>' > android/app/src/main/res/values/ic_launcher_background.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <background android:drawable="@color/ic_launcher_background" />' \
            '    <foreground android:drawable="@mipmap/ic_launcher_foreground" />' \
            '</adaptive-icon>' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
            android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          # Replace splash screens with centered Sirah Nabi emblem on #070D24
          find android/app/src/main/res -name "splash.png" | while read -r splash; do
            dims=$(identify -format "%wx%h" "$splash" 2>/dev/null || echo "1080x1920")
            w=${dims%x*}
            h=${dims#*x}
            min_dim=$(( w < h ? w : h ))
            icon_dim=$(( min_dim * 42 / 100 ))
            convert -size "${w}x${h}" "xc:#070D24" \
              \( public/pwa-512x512.png -resize "${icon_dim}x${icon_dim}" \) \
              -gravity center -composite "$splash"
          done

          # Enable autoplay audio & match dark navy system bars inside standalone APK
          mkdir -p android/app/src/main/java/id/kelompok3/sirahnabi
          printf '%s\n' \
            'package id.kelompok3.sirahnabi;' \
            '' \
            'import android.graphics.Color;' \
            'import android.os.Bundle;' \
            'import android.webkit.WebSettings;' \
            'import com.getcapacitor.BridgeActivity;' \
            '' \
            'public class MainActivity extends BridgeActivity {' \
            '    @Override' \
            '    public void onCreate(Bundle savedInstanceState) {' \
            '        super.onCreate(savedInstanceState);' \
            '        getWindow().setStatusBarColor(Color.parseColor("#070D24"));' \
            '        getWindow().setNavigationBarColor(Color.parseColor("#070D24"));' \
            '        if (getBridge() != null && getBridge().getWebView() != null) {' \
            '            WebSettings settings = getBridge().getWebView().getSettings();' \
            '            settings.setMediaPlaybackRequiresUserGesture(false);' \
            '            settings.setDomStorageEnabled(true);' \
            '            settings.setAllowFileAccess(true);' \
            '        }' \
            '    }' \
            '}' > android/app/src/main/java/id/kelompok3/sirahnabi/MainActivity.java

      - name: Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Sirah-Nabi-Kelompok-3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sirah-Nabi-Android-APK
          path: Sirah-Nabi-Kelompok-3.apk
          retention-days: 90

      - name: Publish APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk Sirah-Nabi-Kelompok-3.apk --clobber
          else
            gh release create latest-apk Sirah-Nabi-Kelompok-3.apk \
              --title "Sirah Nabi Android APK" \
              --notes "Aplikasi Android mandiri Sirah Nabi (berjalan langsung secara offline tanpa browser atau bilah URL web)."
          fi
